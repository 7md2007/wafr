<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wafr">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#080F1C">
<meta name="color-scheme" content="dark light">
<title>Wafr</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ================= tokens: UAE ocean blue & falcon gold ================= */
:root{
  --bg:#081426;--bg2:#0D1D34;--card:#132942;--elev:#1B365D;
  --tx:#F7FAFF;--tx2:#C3D2E3;--tx3:#AFC0D4;
  --acc:#60C1E5;--acc-ink:#071528;--acc-text:#7FD0EE;--acc-soft:rgba(96,193,229,.16);--acc-hover:#86D2EE;
  --sky:#A0E0EF;--gold:#E6BA66;--line:#35516F;--line2:#24405F;
  --ok:#5FD39A;--warn:#F2C35B;--err:#FF9B8F;
  --hero1:#1B365D;--hero2:#005A9C;--hero-tx:#FFFFFF;--hero-tx2:#D9ECF8;--hero-track:rgba(255,255,255,.22);--hero-fill:#A0E0EF;
  --scrim:rgba(3,10,22,.66);--shadow:0 1px 2px rgba(0,0,0,.25);--shadow-pop:0 16px 44px rgba(0,0,0,.45);
  --r-card:20px;--r-ctl:14px;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --bnav-h:72px;--ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:dark;
}
html.light{
  --bg:#F2F7FC;--bg2:#FFFFFF;--card:#FFFFFF;--elev:#E6F2FA;
  --tx:#142D4C;--tx2:#465F79;--tx3:#4D6680;
  --acc:#005A9C;--acc-ink:#FFFFFF;--acc-text:#005A9C;--acc-soft:#E1F0FA;--acc-hover:#004B83;
  --sky:#A0E0EF;--gold:#8A641C;--line:#CFDEEB;--line2:#DFE9F2;
  --ok:#1E7A4C;--warn:#8A5A00;--err:#B3261E;
  --hero-fill:#A0E0EF;
  --scrim:rgba(20,45,76,.4);--shadow:0 1px 2px rgba(20,45,76,.06),0 4px 14px rgba(20,45,76,.05);--shadow-pop:0 18px 50px rgba(20,45,76,.2);
  color-scheme:light;
}
html[lang=ar]{--font:"IBM Plex Sans Arabic","Inter",system-ui,sans-serif}

/* ================= base ================= */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
@media (pointer:fine){html{overscroll-behavior:none}}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--font);font-size:18px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
a{color:inherit;touch-action:manipulation}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.25}
p{margin:0}
.num,.amt,.hero-amt,dd{font-variant-numeric:tabular-nums}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
[dir=rtl] .flip{transform:scaleX(-1)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:8px}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:fixed;top:8px;inset-inline-start:8px;z-index:100;background:var(--acc);color:var(--acc-ink);padding:12px 16px;border-radius:12px;font-weight:600;transform:translateY(-200%);transition:transform .15s}
.skip:focus-visible{transform:none}
.muted{color:var(--tx2)}.fine{font-size:16px;color:var(--tx2);line-height:1.5}
.neg{color:var(--err)!important}

/* ================= shell ================= */
.shell{display:grid;grid-template-columns:minmax(0,1fr)}
.side{display:none}
.main-wrap{min-width:0}
main{width:100%;max-width:1200px;margin-inline:auto;padding:8px 16px calc(var(--bnav-h) + 100px + env(safe-area-inset-bottom));outline:none}
.mbar{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 14px) 16px 4px;font-weight:700;font-size:20px;color:var(--tx)}
html.light .mbar{color:#1B365D}
.mark{flex:none;display:block}
.mark-bg{fill:#1B365D}.mark-head{fill:#E6BA66}.mark-dk{fill:#1B365D}.mark-eye{fill:#E6BA66}.mark-pupil{fill:#0D1D34}.mark-line{fill:none;stroke:#1B365D;stroke-width:1;stroke-linecap:round}
html:not(.light) .mark-bg{stroke:rgba(96,193,229,.45);stroke-width:1}

/* bottom nav */
.bnav{position:fixed;inset-inline:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);height:calc(var(--bnav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--bg2);border-top:1px solid var(--line)}
.bnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;color:var(--tx2);font-size:15px;font-weight:500;min-height:48px}
.bnav a .pill{display:grid;place-items:center;width:58px;height:32px;border-radius:99px;transition:background-color .18s var(--ease)}
.bnav a[aria-current=page]{color:var(--tx);font-weight:700}
.bnav a[aria-current=page] .pill{background:var(--acc);color:var(--acc-ink)}
.fab{position:fixed;z-index:31;inset-inline-end:16px;bottom:calc(var(--bnav-h) + env(safe-area-inset-bottom) + 14px);display:inline-flex;align-items:center;gap:10px;height:56px;padding:0 22px 0 18px;border-radius:18px;background:var(--acc);color:var(--acc-ink);font-weight:700;font-size:18px;box-shadow:var(--shadow-pop);transition:transform .15s var(--ease),background-color .18s}
.fab:hover{background:var(--acc-hover)}.fab:active{transform:scale(.97)}
.fab[hidden]{display:none}

@media (min-width:720px){
  .shell{grid-template-columns:96px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;align-items:center;gap:6px;position:sticky;top:0;align-self:start;max-height:100vh;max-height:100dvh;overflow-y:auto;padding:18px 8px;background:var(--bg2);border-inline-end:1px solid var(--line)}
  .side .brand{display:flex;align-items:center;gap:12px;padding:2px 0 14px;text-decoration:none}
  .side .brand b{display:none}
  .side .add{width:56px;height:56px;padding:0;justify-content:center;margin-bottom:10px}
  .side .add span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
  .side nav{display:flex;flex-direction:column;gap:4px;width:100%}
  .nl{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:64px;padding:8px 4px;border-radius:14px;color:var(--tx2);text-decoration:none;font-size:13px;font-weight:500;text-align:center;line-height:1.2;transition:background-color .18s,color .18s}
  .nl:hover{background:var(--card);color:var(--tx)}
  .nl[aria-current=page]{background:var(--acc-soft);color:var(--tx);font-weight:700}
  .nl[aria-current=page] svg{color:var(--acc-text)}
  .side-foot{margin-top:auto;padding-top:12px}
  .side-foot .sync span{display:none}
  .bnav,.fab,.mbar{display:none!important}
  main{padding:32px clamp(24px,4vw,48px) 64px}
  .mobile-only{display:none!important}
}
@media (min-width:1100px){
  .shell{grid-template-columns:264px minmax(0,1fr)}
  .side{align-items:stretch;padding:24px 16px}
  .side .brand{padding:2px 8px 20px}.side .brand b{display:block;font-size:24px;letter-spacing:-.01em;color:var(--tx)}
  html.light .side .brand b{color:#1B365D}
  .side .add{width:100%;height:56px;padding:0 18px;margin-bottom:16px}
  .side .add span{position:static;width:auto;height:auto;clip:auto;overflow:visible}
  .nl{flex-direction:row;justify-content:flex-start;gap:14px;min-height:52px;padding:0 14px;font-size:18px;text-align:start;position:relative}
  .nl[aria-current=page]::before{content:"";position:absolute;inset-inline-start:-16px;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--acc)}
  [dir=rtl] .nl[aria-current=page]::before{border-radius:4px 0 0 4px}
  .side-foot{padding:12px 8px 0}.side-foot .sync span{display:inline}
}

/* ================= headings ================= */
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 18px;margin:8px 0 24px}
.phead h1{font-size:clamp(28px,3.2vw,36px);font-weight:700;letter-spacing:-.015em}
html.light .phead h1,html.light h2{color:#1B365D}
.phead .psub{color:var(--tx2);font-size:18px;margin-top:6px}
.phead .acts{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.shead2{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 2px 12px;min-height:40px}
.shead2 h2{font-size:22px;font-weight:700}
.ctitle{font-size:22px;font-weight:700}

/* ================= controls ================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 22px;border-radius:var(--r-ctl);font-weight:600;font-size:18px;text-decoration:none;white-space:nowrap;transition:background-color .18s var(--ease),transform .12s var(--ease),border-color .18s,color .18s}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-pri{background:var(--acc);color:var(--acc-ink);font-weight:700}.btn-pri:hover:not(:disabled){background:var(--acc-hover)}
.btn-sec{background:var(--card);color:var(--tx);border:1.5px solid var(--line)}.btn-sec:hover:not(:disabled){background:var(--elev);border-color:var(--acc)}
.btn-text{min-height:48px;padding:0 10px;color:var(--acc-text);font-weight:600;border-radius:10px}.btn-text:hover{background:var(--acc-soft)}
.btn-danger{background:color-mix(in srgb,var(--err) 15%,transparent);color:var(--err);border:1.5px solid color-mix(in srgb,var(--err) 40%,transparent)}.btn-danger:hover{background:color-mix(in srgb,var(--err) 24%,transparent)}
.btn-ghost-danger{color:var(--err);padding:0 12px}.btn-ghost-danger:hover{background:color-mix(in srgb,var(--err) 12%,transparent)}
.btn.block{width:100%}
.ib{display:grid;place-items:center;width:48px;height:48px;border-radius:12px;color:var(--tx);transition:background-color .18s,color .18s}
.ib:hover:not(:disabled){background:var(--elev)}
.ib:disabled{opacity:.35;cursor:not-allowed}
.link{color:var(--acc-text);font-weight:600;font-size:17px;text-decoration:none;display:inline-flex;align-items:center;gap:4px;min-height:48px;padding:0 8px;border-radius:10px}
.link:hover{text-decoration:underline}

.field{display:block;margin-bottom:20px}
.flabel{display:block;font-size:18px;font-weight:600;margin-bottom:8px}
.fhelp{font-size:16px;color:var(--tx2);margin-top:8px}
.ferr{display:flex;gap:8px;align-items:flex-start;font-size:16px;color:var(--err);margin-top:8px;font-weight:600}
.ferr[hidden]{display:none}
.ferr svg.i{width:18px;height:18px;margin-top:2px}
.input{width:100%;min-height:54px;padding:0 16px;border-radius:var(--r-ctl);border:1.5px solid var(--line);background:var(--bg);color:var(--tx);font-size:18px;transition:border-color .18s,box-shadow .18s}
html.light .input{background:#fff}
.input:hover{border-color:color-mix(in srgb,var(--line) 40%,var(--tx2))}
.input:focus-visible,.input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-soft)}
.input[aria-invalid=true]{border-color:var(--err)}
.input::placeholder{color:var(--tx3);opacity:1}
textarea.input{padding:14px 16px;min-height:110px;resize:vertical;line-height:1.45}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--tx2) 50%),linear-gradient(135deg,var(--tx2) 50%,transparent 50%);background-position:calc(100% - 21px) 24px,calc(100% - 15px) 24px;background-size:6px 6px;background-repeat:no-repeat;padding-inline-end:40px}
[dir=rtl] select.input{background-position:21px 24px,15px 24px}
select.input option{background:var(--card);color:var(--tx)}
.money{position:relative}
.money .input{padding-inline-start:66px}
.money .cur{position:absolute;inset-inline-start:16px;top:50%;transform:translateY(-50%);font-size:17px;font-weight:700;color:var(--tx2);pointer-events:none}
.grid2{display:grid;gap:0 14px}
@media (min-width:520px){.grid2{grid-template-columns:1fr 1fr}}

.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:14px;background:var(--bg);border:1.5px solid var(--line)}
html.light .seg{background:var(--elev)}
.seg button{display:inline-flex;align-items:center;gap:6px;min-height:46px;padding:0 16px;border-radius:10px;font-size:17px;font-weight:500;color:var(--tx2);transition:background-color .18s,color .18s}
.seg button:hover{color:var(--tx)}
.seg button[aria-checked=true]{background:var(--acc);color:var(--acc-ink);font-weight:700}
.seg button svg.i{width:18px;height:18px}

.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 16px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);font-size:17px;font-weight:500;color:var(--tx);max-width:100%;transition:background-color .18s,border-color .18s,color .18s}
.chip:hover{border-color:var(--acc)}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:700}
.chip svg.i{width:18px;height:18px}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.status{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:99px;font-size:16px;font-weight:700;background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok);white-space:nowrap}
.status svg.i{width:18px;height:18px}
.status.watch{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.status.over{background:color-mix(in srgb,var(--err) 16%,transparent);color:var(--err)}

/* ================= cards & lists ================= */
.card{background:var(--card);border:1px solid var(--line2);border-radius:var(--r-card);box-shadow:var(--shadow)}
.pad{padding:20px}
@media (min-width:720px){.pad{padding:28px}}
.list{list-style:none;margin:0;padding:0}
.list>li+li{border-top:1px solid var(--line2)}
.row{display:flex;align-items:center;gap:14px;width:100%;min-height:76px;padding:12px 18px;text-align:start;text-decoration:none;color:inherit;transition:background-color .15s}
button.row:hover,a.row:hover{background:color-mix(in srgb,var(--elev) 55%,transparent)}
.row:focus-visible{outline-offset:-3px;border-radius:14px}
.list>li:first-child .row{border-radius:var(--r-card) var(--r-card) 0 0}
.list>li:last-child .row{border-radius:0 0 var(--r-card) var(--r-card)}
.list>li:only-child .row{border-radius:var(--r-card)}
.row .main{flex:1;min-width:0}
.row .main b{display:block;font-weight:600;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .main span{display:block;font-size:16px;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .end{text-align:end;flex:none}
.row .chev{width:20px;height:20px;color:var(--tx2)}
.amt{font-weight:700;white-space:nowrap;font-size:18px}
.mw{white-space:nowrap;unicode-bidi:isolate}
.amt .c,.mw .c{font-size:.82em;color:var(--tx2);font-weight:600}
.tile{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;flex:none;background:var(--c);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.tile svg.i{width:22px;height:22px;stroke-width:2.1}
.dayh{display:flex;justify-content:space-between;gap:12px;padding:18px 18px 6px;font-size:16px;font-weight:700;color:var(--tx2)}
.daygroup+.daygroup{border-top:1px solid var(--line2)}

.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:36px 20px}
.empty .ill{margin-bottom:4px}
.empty h3{font-size:20px;font-weight:700}
.empty p{color:var(--tx2);font-size:17px;max-width:40ch}
.empty .btn{margin-top:8px}
.empty.sm{padding:22px 18px;gap:6px}

/* ================= home ================= */
.home-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin:8px 0 22px}
.home-head .phead{margin:0}
.hh-right{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.cycle{display:inline-flex;align-items:center;gap:2px;padding:4px;border-radius:16px;background:var(--card);border:1.5px solid var(--line)}
.cyc-lab{display:flex;flex-direction:column;align-items:center;padding:0 8px;min-width:150px;line-height:1.3}
.cyc-lab span{font-weight:700;font-size:17px;white-space:nowrap}
.cyc-lab small{font-size:14px;color:var(--tx2)}
.cyc-lab button{font-size:15px;color:var(--acc-text);font-weight:700;min-height:24px;text-decoration:underline}

.home-grid{display:flex;flex-direction:column;gap:24px}
.home-grid .col{display:contents}
.o1{order:1}.o2{order:2}.o3{order:3}.o4{order:4}.o5{order:5}
@media (min-width:1024px){
  .home-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:28px;align-items:start}
  .home-grid .col{display:flex;flex-direction:column;gap:28px}
}
.hero{position:relative;overflow:hidden;padding:24px 22px 20px;color:var(--hero-tx);background:linear-gradient(135deg,var(--hero1) 0%,var(--hero2) 100%);border:0;box-shadow:0 10px 30px rgba(0,40,90,.25)}
@media (min-width:720px){.hero{padding:30px 32px 24px}}
.hero-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start}
.hero-art{width:clamp(120px,12vw,170px);height:auto;margin-top:-2px;opacity:.92}

.hero-emblem{display:none}
@media (max-width:719px){.hero-art{display:none}.hero-emblem{display:block}}
.hero-coast{position:absolute;inset-inline:0;bottom:0;width:100%;height:46px;color:rgba(160,224,239,.22);pointer-events:none}
.hero>*:not(.hero-coast){position:relative}
.hero-lab,html.light .hero .hero-lab{font-size:20px;font-weight:600;color:var(--hero-tx2)}
.hero-amt{display:flex;align-items:flex-start;flex-wrap:wrap;gap:10px;font-size:clamp(48px,11vw,68px);font-weight:800;letter-spacing:-.02em;line-height:1.05;margin:10px 0 10px;color:#fff;overflow-wrap:anywhere}
.hero-amt .c{font-size:.4em;font-weight:700;color:var(--hero-tx2);letter-spacing:0;margin-top:.3em}
.hero-amt.neg{color:#FFD0C9!important}
.hero-exp{color:var(--hero-tx2);font-size:18px;max-width:40ch}
.meter{height:12px;border-radius:99px;background:var(--hero-track);overflow:hidden;margin-top:22px}
.meter i{display:block;height:100%;border-radius:99px;background:var(--hero-fill);transition:width .35s var(--ease)}
.meter.over i{background:#FF9B8F}
.meter-lab{display:flex;justify-content:space-between;gap:8px 16px;font-size:17px;color:var(--hero-tx2);margin-top:12px;flex-wrap:wrap}
.meter-lab b{color:#fff;font-weight:700}
.alert{display:flex;gap:10px;align-items:flex-start;margin-top:18px;padding:14px 16px;border-radius:14px;font-size:17px;line-height:1.45}
.alert svg.i{width:20px;height:20px;margin-top:2px}
.hero .alert{background:rgba(8,20,38,.45);color:#fff}
.hero .alert.err svg{color:#FFB4AA}.hero .alert.info svg{color:var(--sky)}
details.calc{margin-top:18px;border-top:1px solid rgba(255,255,255,.2);padding-top:6px;margin-bottom:22px}
details.calc summary{display:flex;align-items:center;gap:8px;min-height:48px;cursor:pointer;font-size:17px;font-weight:700;color:#fff;list-style:none;border-radius:8px;width:max-content;max-width:100%;text-decoration:underline;text-underline-offset:4px;text-decoration-color:rgba(255,255,255,.45)}
details.calc summary::-webkit-details-marker{display:none}
details.calc summary svg{transition:transform .18s var(--ease);width:20px;height:20px}
details.calc[open] summary svg{transform:rotate(180deg)}
.calc dl{margin:6px 0 0;display:grid;gap:0;background:rgba(8,20,38,.35);border-radius:14px;padding:4px 16px}
.calc dl>div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.14);font-size:17px}
.calc dt{color:var(--hero-tx2)}.calc dd{margin:0;font-weight:700;text-align:end;white-space:nowrap}
.calc dl>div.tot{border-bottom:0}.calc dl>div.tot dt{color:#fff;font-weight:700}
.calc p{font-size:16px;color:var(--hero-tx2);margin-top:12px}

/* ================= premium material layer ================= */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,"IBM Plex Sans Arabic","Geeza Pro",system-ui,sans-serif;
  --bg:#080F1C;--card:#111C2E;--elev:#18263D;--line:#2A3A52;--line2:rgba(255,255,255,.07);
  --nav:rgba(12,21,37,.78);--nav-solid:#0C1525;
  --shadow:0 1px 1px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.22);
  --r-card:22px;--r-ctl:12px;
  --glow1:rgba(35,100,190,.16);--glow2:rgba(60,175,210,.06);
}
html.light{
  --bg:#F5F6F8;--card:rgba(255,255,255,.97);--elev:#F1F4F8;--line:#DCE3EB;--line2:rgba(20,45,76,.07);
  --nav:rgba(255,255,255,.72);--nav-solid:#FFFFFF;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06);
  --glow1:rgba(70,130,230,.10);--glow2:rgba(80,195,225,.07);
}
html[lang=ar]{--font:"IBM Plex Sans Arabic",-apple-system,BlinkMacSystemFont,"SF Pro Text","Geeza Pro","Inter",system-ui,sans-serif}
html{background-color:var(--bg);background-image:radial-gradient(1100px 520px at 18% -140px,var(--glow1),transparent 70%),radial-gradient(620px 420px at 105% -60px,var(--glow2),transparent 72%);background-repeat:no-repeat;min-height:100%}
body{background:transparent}
.card{background:var(--card);border:1px solid var(--line2);box-shadow:var(--shadow)}
html.light .card{border-color:rgba(20,45,76,.06)}
.card.hero{border:0;background:linear-gradient(135deg,#1B365D 0%,#005A9C 100%);box-shadow:0 1px 2px rgba(0,30,70,.12),0 14px 34px rgba(0,60,130,.22)}
/* translucent navigation only */
.bnav{background:var(--nav-solid);border-top:1px solid var(--line2)}
@media (min-width:720px){.side{background:var(--nav-solid);border-inline-end:1px solid var(--line2)}}
@supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  .bnav{background:var(--nav);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px)}
  @media (min-width:720px){.side{background:var(--nav);-webkit-backdrop-filter:saturate(160%) blur(16px);backdrop-filter:saturate(160%) blur(16px)}}
}
@media (prefers-reduced-transparency:reduce){.bnav{background:var(--nav-solid);backdrop-filter:none;-webkit-backdrop-filter:none}.side{background:var(--nav-solid)!important;backdrop-filter:none!important}}
.mbar{background:transparent}
/* finer controls, neutral borders */
.input,.amt-field,.seg,.chip,.btn-sec,.cycle,details.more,.choice,.radio,.catopt,details.adv{border-width:1px}
.input,.amt-field{border-color:var(--line);background-color:var(--card)}
html:not(.light) .input,html:not(.light) .amt-field{background-color:#0D1626}
.input:hover{border-color:color-mix(in srgb,var(--line) 55%,var(--tx2))}
.btn-sec{background:var(--card);border-color:var(--line);box-shadow:0 1px 1px rgba(16,24,40,.04)}
.cycle{background:var(--card);border-color:var(--line2);box-shadow:var(--shadow)}
.chip{background:var(--card);border-color:var(--line)}
.seg{background:var(--elev);border-color:var(--line2)}
.choice{border-color:var(--line);box-shadow:none}

details.adv{border-color:var(--line2);box-shadow:var(--shadow)}

/* expenses page: one grid, calm controls */

.list>li+li{border-top-color:var(--line2)}

/* feedback */

/* other pages: lighter cards than the summary */
.card{box-shadow:0 1px 2px rgba(16,24,40,.04)}
html:not(.light) .card{background:var(--panel);border-color:var(--panel-line)}
@media (max-width:719px){
  .hero{padding:18px 18px 4px;border-radius:24px}
  .hero-amt{font-size:52px}
  .hero-exp{display:block;font-size:15px}
  .meter{margin-top:14px}
  .sumcard{padding:16px 18px}
  .srows>div{padding:10px 0}.srows dd{font-size:20px}
  .panel{padding:14px 4px 4px}
  .dash{gap:14px}
}

/* ================= brand logos & suggestions ================= */
.blogo{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;flex:none;background:#fff;box-shadow:inset 0 0 0 1px rgba(20,45,76,.10),0 1px 2px rgba(16,24,40,.06);overflow:hidden}
.blogo svg{width:56%;height:56%}
.blogo.onDark{background:#1A1A1A}
.blogo.mono b{font-weight:800;letter-spacing:-.02em;line-height:1;font-size:22px;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",sans-serif}
.blogo.mono{box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.blogo.sm{width:32px;height:32px;border-radius:9px}.blogo.sm.mono b{font-size:15px}
.blogo.xs{width:22px;height:22px;border-radius:6px}.blogo.xs.mono b{font-size:10px}
.bwrap{position:relative}
.bwrap .bbadge{position:absolute;inset-inline-start:10px;top:50%;transform:translateY(-50%);pointer-events:none;display:flex}
.bwrap .bbadge:not(:empty)+.input{padding-inline-start:52px}
.sug{position:relative;z-index:5;margin-top:6px;border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:0 12px 32px -8px rgba(16,40,80,.28);overflow:hidden}
html:not(.light) .sug{background:#13213A}
.sug[hidden]{display:none}
.sug-o{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 12px;cursor:pointer}
.sug-o+.sug-o{border-top:1px solid var(--line2)}
.sug-o:hover,.sug-o[aria-selected=true]{background:var(--acc-soft)}
.sug-o .blogo{width:40px;height:40px;border-radius:12px}
.sug-t{flex:1;min-width:0}.sug-t b{display:block;font-size:17px}.sug-t small{display:block;font-size:14.5px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sug-hint{display:flex;align-items:center;gap:8px;padding:10px 14px;font-size:15px;font-weight:600;color:var(--acc-text);background:var(--acc-soft)}
.sug-hint svg.i{width:18px;height:18px}
.subnudge{margin-top:10px;min-height:44px;font-size:15px}
.subnudge[hidden]{display:none}
.chip .blogo.xs{box-shadow:none}

/* ================= coastal concept ================= */
@media (max-width:719px){.srows>div.sv{display:none!important}}
.meter,.meter-lab{max-width:62%!important}
@media (max-width:719px){.meter,.meter-lab{max-width:none!important}}
.hero .hero-falcon{position:absolute!important}
.hero-amt{gap:.22em!important;align-items:baseline!important}
.srows dt span small{display:block}
@media (max-width:719px){.srows dt span small{display:none!important}}
:root{--bg:#060C18;--panel:#0F1A2C;--panel-line:rgba(255,255,255,.08);--side:#0A1322}
html.light{--bg:#F6F8FB;--panel:#FFFFFF;--panel-line:rgba(20,45,76,.08);--side:#FFFFFF}
.sc-top,.sc-low{display:none!important}
.coast{position:absolute;top:0;inset-inline:0;height:300px;pointer-events:none;background:none right top/auto 100% no-repeat;-webkit-mask-image:linear-gradient(to left,#000 30%,transparent 78%),linear-gradient(#000 60%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(to left,#000 30%,transparent 78%),linear-gradient(#000 60%,transparent);mask-composite:intersect}
html:not(.light) .coast{background-image:none}
[dir=rtl] .coast{transform:scaleX(-1)}
@media (min-width:720px){.coast{inset-inline-start:96px;height:460px;background-size:auto 100%;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}}
@media (min-width:1100px){.coast{inset-inline-start:264px}}
/* brand */
.mark.wing .wk0{fill:#123A6E}.mark.wing .wk1{fill:#005A9C}.mark.wing .wk2{fill:#1C7FC4}.mark.wing .wk3{fill:#60C1E5}
html:not(.light) .mark.wing .wk0{fill:#CFE9F7}html:not(.light) .mark.wing .wk1{fill:#60C1E5}html:not(.light) .mark.wing .wk2{fill:#2C8FD0}html:not(.light) .mark.wing .wk3{fill:#1B5FA0}
.mark.wing .mark-bg{display:none}
.side .brand b{font-size:26px;font-weight:600;letter-spacing:-.01em;color:#123A6E}
html:not(.light) .side .brand b{color:#EAF4FB}
.mbar span[translate]{font-size:22px;font-weight:600;color:#123A6E}
html:not(.light) .mbar span[translate]{color:#EAF4FB}
@media (min-width:720px){.side{background:var(--side)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;border-inline-end:1px solid var(--panel-line)}}
.nl[aria-current=page]{background:var(--acc-soft)}
/* header */
.home-head{flex-direction:row;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;padding-inline-end:0;margin:4px 0 22px}
.greet{font-size:clamp(30px,3.6vw,46px)}
.hh-right{margin-top:8px}
.cycle{border-radius:14px;background:var(--panel);box-shadow:0 2px 10px rgba(16,40,80,.08)}
.status{gap:8px;min-height:44px;padding:0 16px;border-radius:14px;background:var(--panel)!important;color:var(--tx);font-weight:600;box-shadow:0 2px 10px rgba(16,40,80,.08)}
.status .sdot{width:12px;height:12px;border-radius:50%;background:#22B566;flex:none}
.status.watch .sdot{background:#E8A317}.status.over .sdot{background:#E5484D}
/* hero */
.hero,.card.hero{background:linear-gradient(100deg,rgba(9,36,82,.92) 0%,rgba(9,48,104,.72) 45%,rgba(10,70,140,.25) 100%) center/cover!important;padding:26px 28px 6px}
html:not(.light) .hero{background:linear-gradient(100deg,rgba(5,22,52,.94) 0%,rgba(6,34,76,.78) 50%,rgba(8,52,110,.35) 100%) center/cover!important}
.hero>*:not(.hero-falcon){position:relative;z-index:1}
.hero-falcon{position:absolute;inset-inline-end:-10px;top:-6px;width:min(36%,230px);height:auto;stroke:#BFE6F7;opacity:.6;z-index:0}
.hero-falcon .hf-fill{fill:#BFE6F7;fill-opacity:.4}
[dir=rtl] .hero-falcon{transform:scaleX(-1)}
.hero-amt{font-size:clamp(52px,6.4vw,84px);font-weight:800;letter-spacing:-.03em;margin:8px 0 6px}
.hero-amt .c{font-size:1em;color:#fff;margin:0;font-weight:800}
.hero-exp{font-size:19px;color:rgba(232,244,252,.92);max-width:28ch}
.meter{height:10px;margin-top:22px;max-width:520px}
.meter-lab{max-width:520px;font-size:17px}
.meter-lab b{color:#fff}
/* summary */
.sumcard{padding:22px 22px 14px}
.ph h2{font-size:22px}
.ph-go{display:none}
.srows>div{border:1px solid var(--panel-line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.srows dt{display:flex;align-items:center;gap:12px;color:var(--tx)}
.srows dt svg.i{color:var(--acc-text);width:22px;height:22px}
.srows dt span small{display:block;font-size:13.5px;color:var(--tx2)}
.srows dd{font-size:20px}
.srows dd .c{font-size:.85em;color:var(--tx);font-weight:700}
/* panels */
.panel{padding:18px 8px 8px;box-shadow:0 2px 12px rgba(16,40,80,.06)}
.panel .ph{padding:0 12px 6px}
.panel .list>li{border:1px solid var(--panel-line)!important;border-radius:14px;margin:0 6px 8px}
.panel .list>li+li{border-top:1px solid var(--panel-line)}
.link .arr{width:16px;height:16px}
.amt .c,.mw .c{color:var(--tx);font-weight:700;font-size:1em}
.askban{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:18px 22px;border-radius:20px;background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 10%,var(--panel)),color-mix(in srgb,var(--acc) 4%,var(--panel)));border:1px solid var(--panel-line)}
.askban .ab-ic{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--panel);color:var(--acc-text);box-shadow:0 2px 8px rgba(16,40,80,.08)}
.askban .main{flex:1 1 240px}.askban b{display:block;font-size:19px}.askban span{font-size:16px;color:var(--tx2)}
.askban .btn{border-color:color-mix(in srgb,var(--acc) 40%,var(--line));color:var(--acc-text)}
@media (min-width:1024px){.dash{grid-template-areas:"hero sum" "rec up" "ask ask";grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}.d-ask{grid-area:ask}.dash .d-rec{grid-column:auto}}
@media (min-width:1024px){.dash{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}.dash{grid-template-areas:"hero sum" "rec up" "ask ask"}}
/* mobile */
@media (max-width:719px){
  .mbar{min-height:56px}
  .home-head{margin:0 0 14px;gap:10px}
  .greet{font-size:30px}
  .hh-right{width:100%;justify-content:flex-start;margin-top:0}
  .hero{padding:18px 18px 4px}
  .hero-amt{font-size:46px}
  .hero-exp{font-size:15px;display:block}
  .hero-falcon{width:34%;top:2px;opacity:.42}
  .meter-lab{font-size:14px}
  .ph-go{display:grid;place-items:center;width:36px;height:36px;color:var(--tx2)}
  .srows{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .srows>div{flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:2px;margin:0;padding:0;border:0}
  .srows>div+div{padding-inline-start:10px;border-inline-start:1px solid var(--panel-line)!important}
  .srows dt svg.i,.srows dt small{display:none}
  .srows dt{font-size:14px;color:var(--tx2)}.srows dd{font-size:17px}
  .sumcard{padding:16px 16px 12px}
  .askban{padding:14px 16px}.askban .btn{width:100%}
  .fab{inset-inline:16px;justify-content:center;border-radius:16px;height:52px}
}

let coll=null,syncState='local',firstSnap=true,loadTimer=null;

function docBody(id){
  if(id==='settings')return S.settings?{v:S.settings}:null;
  if(id==='subs')return{items:S.subs};
  if(id==='inst')return{items:S.inst};
  if(id==='ledger')return{items:S.ledger};
  if(id==='res')return{items:S.res};
  if(id.startsWith('exp-')){const a=S.exp[id.slice(4)];return a&&a.length?{items:a}:null}
  return null;
}
function persist(ids){
  lsSave();
  if(!coll)return;
  ids.forEach(id=>{dirty.add(id);pump(id)});
}
function pump(id){
  if(!coll||inflight.has(id)||!dirty.has(id))return;
  dirty.delete(id);inflight.add(id);
  const body=docBody(id),ref=coll.doc(id);
  (body?ref.set(body):ref.delete()).catch(e=>{
    const c=e&&e.code;
    if(c==='unavailable')dirty.add(id);
    else if(c==='quota_exceeded')toast('Storage is full — export a backup and erase old data.');
  }).finally(()=>{inflight.delete(id);if(dirty.has(id))setTimeout(()=>pump(id),500+Math.random()*500)});
}
function allIds(){return['settings','subs','inst','ledger','res',...Object.keys(S.exp).map(k=>'exp-'+k)]}
async function initCloud(){
  try{if(!syncAllowed())return;

    if(!db||!user){syncState='local';renderSide();return}
    const id=await user.id();
    if(!id){syncState='local';renderSide();return}
    coll=db.collection('data/users/'+id);
    loadTimer=setTimeout(()=>{syncState='local';renderSide()},10000);
    coll.onSnapshot(onSnap,()=>{clearTimeout(loadTimer);coll=null;syncState='local';renderSide()});
  }catch(e){syncState='local';renderSide()}
}
function onSnap(snap){
  if(!snap.metadata.fromCache){clearTimeout(loadTimer);syncState='on'}
  if(firstSnap&&!snap.metadata.fromCache){
    firstSnap=false;
    if(snap.empty){ if(S.settings||S.subs.length||S.inst.length||S.ledger.length||S.res.length||Object.keys(S.exp).length)persist(allIds()); renderAll(); return }
  }
  if(snap.empty&&snap.metadata.fromCache)return;
  if(snap.empty)return;
  const exp={};let settings=null,subs=null,inst=null,ledger=null,res=null;
  snap.docs.forEach(d=>{
    if(!d.exists)return;const b=d.data();
    if(d.id==='settings')settings=b.v;
    else if(d.id==='subs')subs=b.items;
    else if(d.id==='inst')inst=b.items;
    else if(d.id==='ledger')ledger=b.items;
    else if(d.id==='res')res=b.items;
    else if(d.id.startsWith('exp-'))exp[d.id.slice(4)]=(b.items||[]).map(x=>({...x}));
  });

  if(!busy('subs')&&subs)S.subs=subs.map(x=>({...x}));
  if(!busy('inst')&&inst)S.inst=JSON.parse(JSON.stringify(inst));
  if(!busy('ledger')&&ledger)S.ledger=ledger.map(x=>({...x}));
  if(!busy('res')&&res)S.res=res.map(x=>({...x}));
  if(S.settings)migrate(S.settings);
  Object.keys(S.exp).forEach(k=>{if(!busy('exp-'+k)&&!(k in exp))delete S.exp[k]});
  Object.keys(exp).forEach(k=>{if(!busy('exp-'+k))S.exp[k]=exp[k]});
  lsSave();processSubs();renderAll();
  if(S.settings&&welcomeOpen)closeSheet();
}

  if(!st.incomeMode)st.incomeMode='manual';
  if(!Array.isArray(st.salaries))st.salaries=[];
  if(st.periodMode==='payday'&&!activeSalaries(st).length)st.periodMode=st.startDay>1?'custom':'month';

/* monthly savings target split across salaries (exact, in fils) */

/* build a schedule; keeps paid payments, re-spreads the rest exactly (fils), last payment takes rounding */

const SUG={el:null,list:[],nl:null,act:-1,mode:null};
function sugTargets(el){return el&&(el.id==='m'&&el.closest('#expform')?'exp':el.id==='sname'?'sub':el.id==='plstore'?'plan':null)}
function sugBox(el){let box=el.parentNode.querySelector('.sug');if(!box){box=document.createElement('div');box.className='sug';box.id=el.id+'-sug';box.setAttribute('role','listbox');box.setAttribute('aria-label',lang()==='ar'?'اقتراحات':'Suggestions');el.after(box);
  el.setAttribute('role','combobox');el.setAttribute('aria-autocomplete','list');el.setAttribute('aria-controls',box.id);el.setAttribute('aria-expanded','false')}return box}
function sugClose(){if(!SUG.el)return;const box=SUG.el.parentNode.querySelector('.sug');if(box){box.innerHTML='';box.hidden=true}SUG.el.setAttribute('aria-expanded','false');SUG.el.removeAttribute('aria-activedescendant');SUG.list=[];SUG.act=-1}
function sugRender(){
  const el=SUG.el,box=sugBox(el),{list,nl}=SUG;
  if(!list.length){box.hidden=true;box.innerHTML='';el.setAttribute('aria-expanded','false');return}
  const hint=(nl.amt||nl.sub)?`<div class="sug-hint">${ic('spark')}<span>${[nl.amt?aedT2(nl.amt):'',nl.sub?(lang()==='ar'?'اشتراك':'Subscription'):''].filter(Boolean).join(' · ')} — ${lang()==='ar'?'اختار المكان':'pick the brand'}</span></div>`:'';
  box.innerHTML=hint+list.map((b,i)=>`<div class="sug-o" role="option" id="${el.id}-o${i}" aria-selected="${i===SUG.act}" data-bid="${b.id}">${brandLogo(b.id)}<span class="sug-t"><b>${esc(b.name)}</b><small>${esc(brandDesc(b))} · ${catName(b.cat)}</small></span></div>`).join('');
  box.hidden=false;el.setAttribute('aria-expanded','true');
  if(SUG.act>=0)el.setAttribute('aria-activedescendant',`${el.id}-o${SUG.act}`);else el.removeAttribute('aria-activedescendant');
}
function sugUpdate(el){
  const r=suggestBrands(el.value);SUG.el=el;SUG.list=r.list;SUG.nl=r.nl;SUG.act=-1;SUG.mode=sugTargets(el);
  // typing breaks a previous brand link unless text still equals that brand's name
  const f=el.form,bid=f&&f.brand&&f.brand.value;if(bid&&BRAND[bid]&&normT(el.value)!==normT(BRAND[bid].name)){f.brand.value='';updBrandBadge(f)}
  sugRender();
}
function updBrandBadge(f){const s=f.querySelector('.bbadge');if(!s)return;const id=f.brand.value;s.innerHTML=id&&BRAND[id]?brandLogo(id,'sm'):''}
function sugPick(id){
  const b=BRAND[id],el=SUG.el;if(!b||!el)return;const f=el.form,nl=SUG.nl||{};const mode=SUG.mode;sugClose();
  const filled=[];
  if(mode==='exp'){
    f.m.value=b.name;f.brand.value=b.id;
    if(!f.dataset.catTouched){const bt=f.querySelector(`.catopt[data-c="${b.cat}"]`);if(bt){A.pickCat(bt);delete f.dataset.catTouched;filled.push(catName(b.cat))}}
    if(nl.amt&&!(parseAmt(f.amt.value)>0)){f.amt.value=nl.amt;filled.unshift(aedT2(nl.amt))}
    const st=$('#aistat');if(st){st.innerHTML=filled.length?`${esc(t('filledFrom'))} ${esc(filled.join(' · '))}. ${esc(t('checkBefore'))}`:'';}
    const sb=$('#subnudge');if(sb)sb.hidden=!(nl.sub||b.cat==='subs');
  }else if(mode==='sub'){
    f.name.value=b.name;f.brand.value=b.id;if(nl.amt&&!(parseAmt(f.amt.value)>0))f.amt.value=nl.amt;showPlans(f);
  }else if(mode==='plan'){
    f.store.value=b.name;f.brand.value=b.id;
    if(nl.amt&&!(parseAmt(f.amount.value)>0))f.amount.value=nl.amt;updPlanPreview();
  }
  updBrandBadge(f);sheetDirty=true;el.focus();
}
document.addEventListener('input',e=>{if(sugTargets(e.target))sugUpdate(e.target)},true);
document.addEventListener('keydown',e=>{
  const el=e.target;if(!sugTargets(el)||el!==SUG.el)return;const n=SUG.list.length;
  if(e.key==='ArrowDown'&&n){e.preventDefault();SUG.act=(SUG.act+1)%n;sugRender()}
  else if(e.key==='ArrowUp'&&n){e.preventDefault();SUG.act=(SUG.act-1+n)%n;sugRender()}
  else if(e.key==='Enter'&&n&&SUG.act>=0){e.preventDefault();e.stopPropagation();sugPick(SUG.list[SUG.act].id)}
  else if(e.key==='Escape'&&n){e.preventDefault();e.stopPropagation();sugClose()}
},true);
document.addEventListener('pointerdown',e=>{const o=e.target.closest('.sug-o');if(o){e.preventDefault();sugPick(o.dataset.bid);return}if(SUG.el&&!e.target.closest('.sug')&&e.target!==SUG.el)sugClose()},true);

  const a=x.match(/(?:AED|د\.?إ|درهم)\s*([\d,]+(?:\.\d{1,2})?)/i)||x.match(/([\d,]+(?:\.\d{1,2})?)\s*(?:AED|د\.?إ|درهم)/i);
  const m=x.match(/\b(?:at|@)\s+([^,\n]+?)(?=\s*(?:,|\bon\b|\bin\b|\.\s|\.$|\bAvl|\bAvail|$))/i)||x.match(/(?:لدى|عند)\s+([^,\n]+?)(?=\s*(?:,|في|بتاريخ|\.|$))/);
  let mer=m?m[1].trim():'';if(mer&&mer===mer.toUpperCase())mer=mer.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());
  return{amt:a?parseFloat(a[1].replace(/,/g,'')):0,m:mer.slice(0,40)}}

const invBound=x=>{const m=boundMap(S.settings);const k=Object.keys(m).find(e=>m[e]===x);return k||x};
function salaryTarget(d){
  const st=S.settings,cur=periodFor(d,0,st),next=addD(cur.end,1);
  const conf=e=>(S.ledger||[]).find(x=>x.type==='salary'&&x.exp===e);
  const curExp=invBound(cur.start);
  if(cur.mode==='opening'){const ne=invBound(next);return{exp:ne,old:conf(ne)}}
  if(d===cur.start||(!conf(curExp)&&diffD(cur.start,d)<=diffD(d,next)))return{exp:curExp,old:conf(curExp)};
  const ne=invBound(next);return{exp:ne,old:conf(ne)};
}

function saveRefund(f){
  const amt=parseAmt(f.amt.value),date=f.date.value||today(),st=f.status.value,o=f.dataset.of?findExp(f.dataset.of):null,id=f.dataset.id;
  const cur=id?findExp(id):null;const max=o?unfils(fils(refundable(o))+(cur?fils(cur.amt):0)):Infinity;
  setErr(f.amt,'rfamt-err',!(amt>0)?t('amountReq'):amt>max+0.001?L(`A refund can’t be more than ${aedC(max)}.`,`الاسترجاع ما يصير أكثر من ${aedC(max)}.`):'');if(!(amt>0)||amt>max+0.001){f.amt.focus();return}
  const dup=o&&refundsOf(o.id).find(x=>x.id!==id&&fils(x.amt)===fils(amt)&&x.date===date);
  if(dup&&!f.dataset.dupok){f.dataset.dupok='1';setErr(f.amt,'rfamt-err',L('You already added this refund (same amount and date). Save again to add it anyway.','سجلت هالاسترجاع قبل (نفس المبلغ والتاريخ). احفظ مرة ثانية لو تبي تضيفه.'));return}
  const base={kind:st==='points'?'points':'refund',status:st==='points'?'done':st,amt,date,time:nowHM(),cat:o?o.cat:'other',m:o?(o.m||catName(o.cat)):L('Refund','استرجاع'),of:o?o.id:'',pay:o?o.pay||'card':'card',brand:o?o.brand||'':'',note:''};
  const docs=[];let undo;
  if(cur){const r=removeExp(id);docs.push(r.doc);const ne={...r.e,...base,date};docs.push(addExp(ne));undo=()=>{const x=removeExp(id);persist([x.doc,addExp(r.e)]);renderAll()}}
  else{const ne={id:'f'+uid(),created:nowMs(),...base};docs.push(addExp(ne));undo=()=>{const x=removeExp(ne.id);if(x){persist([x.doc]);renderAll()}}}
  persist([...new Set(docs.filter(Boolean))]);closeSheet();renderAll();toast(st==='done'?L(`Refund added — +${aedT(amt)} to spend`,`انضاف الاسترجاع — +${aedT(amt)} للصرف`):L('Saved — it won’t count until you mark it received','انحفظ — ما ينحسب لين تأكد إنه وصل'),undo);
}

function balanceSheet(){const r=calc(0),exp=unfils(fils(r.funds)-fils(r.spent));

/* ---------- #11 bank-message parsing: structured rules first, review when unsure ---------- */
const PARSER_VERSION='2026.11-1';
const BANKS=[['enbd',/emirates ?nbd|\benbd\b|الإمارات دبي الوطني/i,'Emirates NBD'],['adcb',/\badcb\b|التجاري/i,'ADCB'],['fab',/\bfab\b|first abu dhabi|أبوظبي الأول/i,'FAB'],['adib',/\badib\b|أبوظبي الإسلامي/i,'ADIB'],['mashreq',/mashreq|المشرق/i,'Mashreq'],['dib',/\bdib\b|dubai islamic|دبي الإسلامي/i,'DIB'],['rak',/rakbank|بنك رأس الخيمة/i,'RAKBANK'],['cbd',/\bcbd\b|commercial bank of dubai/i,'CBD'],['wio',/\bwio\b/i,'Wio'],['liv',/\bliv\b/i,'Liv']];
const CUR='AED|USD|EUR|GBP|SAR|QAR|KWD|BHD|OMR|INR|PKR|EGP|TRY|JPY|CNY|د\\.?إ|درهم|ريال|دولار';
const AMT_RE=new RegExp(`(?:(${CUR})\\s*([\\d,]+(?:\\.\\d{1,2})?)|([\\d,]+(?:\\.\\d{1,2})?)\\s*(${CUR}))`,'gi');
const normCur=c=>{c=(c||'').toUpperCase();if(/د\.?إ|درهم/.test(c))return'AED';if(/ريال/.test(c))return'SAR';if(/دولار/.test(c))return'USD';return c};
function parseBankMsg(raw){
  const x=String(raw||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/\s+/g,' ').trim().slice(0,600);
  const out={v:PARSER_VERSION,text:x,status:'review',kind:'purchase',amt:0,cur:'',m:'',date:'',bank:'',notes:[]};
  if(!x){out.status='reject';out.reason='empty';return out}
  const bank=BANKS.find(b=>b[1].test(x));if(bank)out.bank=bank[2];
  if(/\b(otp|one[- ]?time (pass(word|code)?|pin)|verification code|passcode)\b|رمز (التحقق|المرور)|كلمة المرور لمرة/i.test(x)){out.status='reject';out.reason='otp';return out}
  const purchase=/(purchase|spent|debited|was used|paid|payment of|transaction (of|at|for)|pos\b|charged)|شراء|عملية شراء|تم خصم|خصم مبلغ|دفع|عملية/i.test(x);
  const refund=/(refund|reversal|reversed|credited back|returned)|استرداد|استرجاع|عكس/i.test(x);
  const withdraw=/(atm|cash withdrawal|withdrawn|withdrew)|سحب نقدي|سحب/i.test(x);
  if(!purchase&&!refund&&!withdraw){
    if(/(offer|win|discount|promo|% off|apply now|pre-?approved|limited time)|عرض|خصم \d+%|اربح|قدم الآن/i.test(x)){out.status='reject';out.reason='promo';return out}
    if(/(balance|avl|available)|الرصيد|رصيدك/i.test(x)){out.status='reject';out.reason='balance';return out}
    if(/(credited|salary|deposit)|إيداع|راتب/i.test(x)){out.status='reject';out.reason='incoming';return out}
  }
  if(withdraw){out.kind='withdraw'}else if(refund&&!/purchase|شراء/i.test(x))out.kind='refund';
  // collect amounts; skip the ones that describe a balance or a limit
  const found=[];let m;AMT_RE.lastIndex=0;
  while((m=AMT_RE.exec(x))){const cur=normCur(m[1]||m[4]),v=parseFloat((m[2]||m[3]).replace(/,/g,''));const before=x.slice(Math.max(0,m.index-28),m.index);
    if(!(v>0)||v>1e7)continue;const bal=/(bal(ance)?|avl|available|limit|outstanding|due)\b[^\d]*$|(الرصيد|المتاح|الحد)[^\d]*$/i.test(before);found.push({cur,v,bal,i:m.index})}
  const use=found.filter(f=>!f.bal);
  if(!use.length){out.status=found.length?'reject':'review';out.reason=found.length?'balance':'no-amount';return out}
  const pick=use[0];out.amt=pick.v;out.cur=pick.cur;
  if(use.length>1&&use.some(f=>f.v!==pick.v&&f.cur===pick.cur))out.notes.push('multiple-amounts');
  if(pick.cur!=='AED'){out.notes.push('foreign');const aed=use.find(f=>f.cur==='AED');if(aed){out.aed=aed.v}}
  const mm=x.match(/\b(?:at|@|from|to)\s+([^,\n]+?)(?=\s*(?:,|\bon\b|\bin\b|\.\s|\.$|\bavl|\bavail|\bcard|\busing|\bwith|$))/i)||x.match(/(?:لدى|عند|في)\s+([^,\n]+?)(?=\s*(?:,|في|بتاريخ|ب?البطاقة|\.|$))/);
  let mer=mm?mm[1].trim():'';if(/^(card|your|the)\b|\d{4}$/i.test(mer))mer='';if(mer&&mer===mer.toUpperCase())mer=mer.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());out.m=mer.slice(0,40);
  const dm=x.match(/\b(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})\b/)||x.match(/\b(\d{1,2})[- ]?(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*[- ]?(\d{2,4})\b/i);
  if(dm){const mo=isNaN(dm[2])?['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'].indexOf(dm[2].slice(0,3).toLowerCase())+1:+dm[2];let y=+dm[3];if(y<100)y+=2000;const d=`${y}-${pad(mo)}-${pad(+dm[1])}`;if(/^\d{4}-\d\d-\d\d$/.test(d)&&mo>=1&&mo<=12&&d<=today()&&d>=addD(today(),-60))out.date=d}
  out.status=out.kind==='withdraw'?'review':(out.cur==='AED'&&!out.notes.length&&out.m?'ok':'review');
  return out;
}

function findDups(amt,date,m,exceptId){const d=date||today();return allExp().filter(e=>e.id!==exceptId&&!e.kind&&fils(e.amt)===fils(amt)&&Math.abs(diffD(e.date,d))<=1&&(!m||!e.m||normT(e.m).slice(0,4)===normT(m).slice(0,4)||diffD(e.date,d)===0))}

}

const AI_LIMITS={chat:40,scan:15,parse:30,cat:60};
function aiBudget(kind){const st=S.settings;if(!st)return false;const u=st.aiUse&&st.aiUse.d===today()?st.aiUse:{d:today()};u[kind]=(u[kind]||0)+1;

/* Foreign-currency receipts → AED. USD is pegged (3.6725). Others: today's rate from open.er-api.com
   (only the currency code is sent, cached for the day). If that fails, the AI's own estimate is used and marked "estimate". */
const FX_PEG={USD:3.6725};
async function fxToAED(cur,amt,aiAed){if(!(amt>0)||!/^[A-Z]{3}$/.test(cur))return null;
  const done=rate=>({rate:+(+rate).toFixed(4),aed:unfils(Math.round(amt*rate*100)),src:'live'});
  if(FX_PEG[cur])return done(FX_PEG[cur]);
  const key='wafr.fx',day=today();let c=null;try{c=JSON.parse(localStorage.getItem(key)||'null')}catch(_){}
  if(!(c&&c.day===day&&c.rates)){try{const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),6000);
    const res=await fetch('https://open.er-api.com/v6/latest/AED',{signal:ac.signal});clearTimeout(tm);const j=await res.json();
    if(j&&j.result==='success'&&j.rates){c={day,rates:j.rates};try{localStorage.setItem(key,JSON.stringify(c))}catch(_){}}}catch(_){}}
  const per=c&&c.rates&&+c.rates[cur];if(per>0)return done(1/per);
  if(aiAed>0)return{...done(aiAed/amt),src:'ai'};return null}

/* ===== Apple Pay inbox =====
   Shortcuts can't write into the Home Screen app's storage, so the Wallet automation POSTs each payment to the

S.rng=S.rng||{k:'today',off:0,a:'',b:''};
const RNG=[['today','Today','اليوم'],['week','Week','أسبوع'],['month','Month','شهر'],['quarter','3 months','3 شهور'],['year','Year','سنة'],['period','Pay period','فترة الراتب'],['custom','Custom','مخصص']];
function rangeFor(k,off){const td=P(today()),y=td.getFullYear(),m=td.getMonth();
  if(k==='today'){const d=addD(today(),off);return{a:d,b:d}}
  if(k==='week'){const dow=(td.getDay()+1)%7;/* week starts Saturday (UAE) */const a=addD(today(),-dow+off*7);return{a,b:addD(a,6)}}
  if(k==='month')return{a:ymd(new Date(y,m+off,1)),b:ymd(new Date(y,m+off+1,0))};
  if(k==='quarter'){const q=Math.floor(m/3)+off;return{a:ymd(new Date(y,q*3,1)),b:ymd(new Date(y,q*3+3,0))}}
  if(k==='year')return{a:ymd(new Date(y+off,0,1)),b:ymd(new Date(y+off,11,31))};
  if(k==='period'){const p=periodFor(today(),off);return{a:p.start,b:p.end}}
  return{a:S.rng.a||addD(today(),-6),b:S.rng.b||today()}}
function rangeLabel(k,r){if(r.a===r.b)return fmtDate(r.a,{weekday:'long',day:'numeric',month:'long'});
  if(k==='month')return P(r.a).toLocaleDateString(loc(),{month:'long',year:'numeric'});
  if(k==='quarter')return`Q${Math.floor(P(r.a).getMonth()/3)+1} ${P(r.a).getFullYear()} · ${fmtDate(r.a)} – ${fmtDate(r.b)}`;
  if(k==='year')return String(P(r.a).getFullYear());
  return`${fmtDate(r.a)} – ${fmtDate(r.b)}`}

  const list=expInRange(r.a,r.b),total=sum(list);const by={};list.forEach(e=>{by[e.cat]=(by[e.cat]||0)+ev(e)});

  const nav=k==='custom'?`<div class="rcustom"><div class="field"><label class="flabel" for="rga">${L('From','من')}</label><input class="input" type="date" id="rga" value="${r.a}" max="${today()}"></div><div class="field"><label class="flabel" for="rgb">${L('To','إلى')}</label><input class="input" type="date" id="rgb" value="${r.b}" max="${today()}"></div></div>`

  const totalH=`<section class="rtotal" aria-live="polite"><p class="rt-lab">${L('Spent','المصروف')}</p><p class="rt-amt num"><bdi>${aedT2(total)}</bdi></p><p class="rt-sub">${plural(list.filter(e=>!e.kind).length)}${k!=='today'&&list.length?` · ${L('About','تقريباً')} <bdi>${aedT(total/Math.max(1,Math.min(diffD(r.a,r.b),diffD(r.a,today()))+1))}</bdi> ${L('a day','باليوم')}`:''}</p></section>`;
  const catH=cats.length?`<section class="calm-sec"><div class="cs-h"><h2>${L('By category','حسب الفئة')}</h2></div><ul class="rcats">${cats.map(([c,v])=>`<li><span class="rc-ic">${ic(catOf(c)[1])}</span><span class="rc-main"><span class="rc-top"><b>${catName(c)}</b><bdi class="num">${aedT(v)}</bdi></span><span class="rc-bar"><i style="width:${Math.max(2,v/max*100)}%"></i></span></span><span class="rc-pct num">${Math.round(v/Math.max(total,1)*100)}%</span></li>`).join('')}</ul></section>`:'';
  const txH=`<section class="calm-sec"><div class="cs-h"><h2>${L('Transactions','العمليات')}</h2></div>${list.length?`<ul class="list clean">${list.slice(0,60).map(expRow).join('')}</ul>${list.length>60?`<p class="fine">${L('Showing the latest 60.','نعرض آخر 60.')} <a href="#expenses">${t('viewAll')}</a></p>`:''}`:`<p class="panel-empty">${L('Nothing recorded in this range.','ما في شي مسجل في هالفترة.')}</p>`}</section>`;
  return`<div class="pagewrap">${pageHead(L('Spending','المصاريف'),L('See what you spent in any time range. This doesn’t change your budget.','شوف كم صرفت في أي فترة. هذا ما يغير ميزانيتك.'))}${tabs}${nav}${totalH}<div class="rgrid">${catH}${txH}</div></div>`}

  autoOff:()=>{S.settings.autoCfg={...(S.settings.autoCfg||{}),off:true};persist(['settings']);autoSheet3();toast(L('Apple Pay capture is off. Also delete the automation in Shortcuts.','انطفى التسجيل التلقائي. امسح الأتمتة من الاختصارات بعد.'))},
  autoOn:()=>{S.settings.autoCfg={...(S.settings.autoCfg||{}),off:false};persist(['settings']);autoSheet3()}
});

VIEWS.home=homeV3;VIEWS.subs=subsV3;VIEWS.insights=spendingV3;welcomeSheet=wizardSheet3;

/* =====================================================================
   Apple-style interaction layer: springs, draggable sheets, press
   feedback, text size, reduced motion / transparency / contrast
   ===================================================================== */
const RM=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
const PHONE=()=>matchMedia('(max-width: 719px)').matches;
/* critically damped by default; response = seconds to settle (not a duration) */
function spring(from,to,v0,opt,onUpdate,onDone){
  const response=opt&&opt.response||.35,damping=opt&&opt.damping!=null?opt.damping:1;
  const k=Math.pow(2*Math.PI/response,2),c=4*Math.PI*damping/response;let x=from,v=v0||0,last=performance.now(),id=0,live=true;
  const h={get value(){return x},get velocity(){return v},stop(){live=false;cancelAnimationFrame(id)}};
  const step=now=>{if(!live)return;let dt=Math.min(.032,(now-last)/1000);last=now;
    for(let i=0;i<4;i++){const s=dt/4;const a=-k*(x-to)-c*v;v+=a*s;x+=v*s}
    onUpdate(x);if(Math.abs(x-to)<.4&&Math.abs(v)<8){x=to;onUpdate(x);live=false;onDone&&onDone();return}id=requestAnimationFrame(step)};
  id=requestAnimationFrame(step);return h}
const projectMomentum=(v,d=.998)=>(v/1000)*d/(1-d);
const rubber=(o,dim,c=.55)=>(o*dim*c)/(dim+c*Math.abs(o));

/* ---------- bottom sheet controller (phones) ---------- */
const SH={y:0,anim:null,closing:false,drag:null};
function shEls(){return{ov:$('#overlay'),sh:$('#sheet')}}
function shH(){const {sh}=shEls();return Math.max(200,sh.getBoundingClientRect().height)}
function shSet(y){const {ov,sh}=shEls();SH.y=y;sh.style.transform=`translate3d(0,${Math.max(y,-40)}px,0)`;const p=Math.max(0,Math.min(1,1-y/shH()));ov.style.setProperty('--scrimA',p.toFixed(3))}
function shStop(){if(SH.anim){SH.anim.stop();SH.anim=null}}
function shTo(target,v,opt,done){shStop();SH.anim=spring(SH.y,target,v||0,opt,shSet,()=>{SH.anim=null;done&&done()})}
function shPhoneMode(){return PHONE()&&!RM()}
const _openSheet=openSheet,_closeSheet=closeSheet;
openSheet=function(title,inner,o){
  const wasClosing=SH.closing;SH.closing=false;const {ov}=shEls();const hiddenBefore=ov.hidden;
  _openSheet(title,inner,o);
  const {sh}=shEls();sh.insertAdjacentHTML('afterbegin',`<div class="grab" aria-hidden="true"><i></i></div>`);
  if(shPhoneMode()){ov.classList.add('springy');
    if(hiddenBefore||!wasClosing){shStop();shSet(shH())} /* interrupted close: continue from where it is */
    shTo(0,SH.anim?SH.anim.velocity:0,{damping:1,response:.38})}
  else{ov.classList.remove('springy');sh.style.transform=''}
};
closeSheet=function(force){const {ov,sh}=shEls();if(ov.hidden)return;
  if(!shPhoneMode()){_closeSheet(force);return}
  if(SH.closing)return;SH.closing=true;ov.classList.remove('open');
  const finish=()=>{if(!SH.closing)return;SH.closing=false;ov.classList.add('open');ov.style.setProperty('--scrimA','0');_closeSheet(force);setTimeout(()=>{if(ov.hidden)sh.style.transform=''},220)};
  shTo(shH()+24,SH.dragV||0,{damping:1,response:.3},finish);SH.dragV=0;
};
/* drag the sheet by its handle/header: 1:1, keeps the grab offset, momentum on release, interruptible */
document.addEventListener('pointerdown',e=>{const moving=!!SH.anim;const g=e.target.closest(moving?'#sheet':'#sheet .grab, #sheet .sh-head');if(!g||!shPhoneMode()||e.button>0)return;if(!moving&&e.target.closest('button,a,input,select,textarea'))return;
  const {ov}=shEls();if(ov.hidden)return;shStop();SH.closing=false;ov.classList.add('open');
  SH.drag={id:e.pointerId,y0:e.clientY,start:SH.y,hist:[{t:e.timeStamp,y:e.clientY}],moved:false};g.setPointerCapture&&g.setPointerCapture(e.pointerId)});
document.addEventListener('pointermove',e=>{const d=SH.drag;if(!d||e.pointerId!==d.id)return;const dy=e.clientY-d.y0;if(!d.moved&&Math.abs(dy)<6)return;d.moved=true;
  let y=d.start+dy;if(y<0)y=rubber(y,shH());shSet(y);d.hist.push({t:e.timeStamp,y:e.clientY});if(d.hist.length>6)d.hist.shift();e.preventDefault()},{passive:false});
function shRelease(e){const d=SH.drag;if(!d||e.pointerId!==d.id)return;SH.drag=null;if(!d.moved){if(SH.y!==0&&!SH.closing)shTo(0,0,{damping:1,response:.3});return}SH.eatClick=true;setTimeout(()=>{SH.eatClick=false},400);
  const h=d.hist,a=h[0],b=h[h.length-1];const v=b.t>a.t?(b.y-a.y)/((b.t-a.t)/1000):0;const H=shH(),end=SH.y+projectMomentum(v);
  if(!sheetLocked&&(end>H*.5||v>900)){SH.dragV=v;closeSheet()}else shTo(0,v,{damping:Math.abs(v)>300?.8:1,response:.32})}
document.addEventListener('click',e=>{if(SH.eatClick){SH.eatClick=false;e.stopPropagation();e.preventDefault()}},true);
document.addEventListener('pointerup',shRelease);document.addEventListener('pointercancel',shRelease);
/* keyboard / button alternatives stay: Esc and the × button both close */

/* ---------- immediate press feedback (commit still happens on click/release) ---------- */
document.addEventListener('touchstart',()=>{},{passive:true});
/* ---------- haptic on meaningful success only (where supported) ---------- */
const _toast=toast;toast=function(msg,undo){_toast(msg,undo);try{if(undo&&navigator.vibrate&&!RM())navigator.vibrate(8)}catch(e){}};

/* ---------- text size (works with or without the browser's own zoom) ---------- */
function applyTextSize(){const z=+(S.settings&&S.settings.textSize)||1;document.documentElement.style.setProperty('--tz',z);document.documentElement.classList.toggle('tz',z!==1)}
const _applyTheme=applyTheme;applyTheme=function(){_applyTheme();applyTextSize()};
Object.assign(A,{textSize:el=>{S.settings.textSize=+el.dataset.z;persist(['settings']);renderAll();const b=$(`[data-a=textSize][data-z="${el.dataset.z}"]`);if(b)b.focus()}});
function textSizeRow(){const z=+(S.settings.textSize||1);return`<li><div class="srow wrap"><span class="main"><b>${L('Text size','حجم الخط')}</b><span>${L('Also follows your browser zoom','يتبع تكبير المتصفح بعد')}</span></span><div class="seg" role="radiogroup" aria-label="${L('Text size','حجم الخط')}">${[[1,L('Standard','عادي')],[1.15,L('Large','كبير')],[1.3,L('Larger','أكبر')]].map(([v,l])=>`<button role="radio" aria-checked="${z===v}" data-a="textSize" data-z="${v}">${z===v?ic('check'):''}${l}</button>`).join('')}</div></div></li>`}

/* =====================================================================
   AI outside Claude: the user's own Anthropic API key, kept on this device.
   Same interface as the Claude capability: AI(turns,opts), AI.json(), AI.limits()
   ===================================================================== */
const KEY_LS='wafr.aikey';
const getKey=()=>{try{return localStorage.getItem(KEY_LS)||''}catch(e){return''}};
const AI_MODEL='claude-haiku-5-5';
function aiError(code,msg){const e=new Error(msg||code);e.code=code;return e}
async function apiCall(body,signal){
  let r;try{r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal,headers:{'content-type':'application/json','x-api-key':getKey(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(body)})}
  catch(e){if(e&&e.name==='AbortError')throw aiError('cancelled');throw aiError('network','offline')}
  if(r.status===401||r.status===403)throw aiError('not_granted','bad key');if(r.status===429||r.status===529)throw aiError('rate_limited');
  if(!r.ok){let m='';try{m=(await r.json()).error.message}catch(_){}throw aiError('api',m||String(r.status))}
  return r.json();
}
const mergeTurns=t=>{const out=[];t.forEach(m=>{const c=typeof m.content==='string'?[{type:'text',text:m.content}]:m.content;const last=out[out.length-1];if(last&&last.role===m.role)last.content=last.content.concat(c);else out.push({role:m.role,content:c.slice()})});if(out[0]&&out[0].role!=='user')out.unshift({role:'user',content:[{type:'text',text:'Hi'}]});return out};
const fileB64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(f)});
function makeKeyAI(){
  const ai=async function(turns,opts){opts=opts||{};let msgs=mergeTurns(turns);const tools=opts.tools||[];
    const defs=tools.map(x=>({name:x.name,description:x.description,input_schema:x.inputSchema}));let text='';
    for(let round=0;round<4;round++){
      const d=await apiCall({model:AI_MODEL,max_tokens:700,messages:msgs,...(defs.length?{tools:defs}:{})},opts.signal);
      const parts=d.content||[];text=parts.filter(p=>p.type==='text').map(p=>p.text).join('\n').trim()||text;
      const uses=parts.filter(p=>p.type==='tool_use');if(!uses.length||d.stop_reason!=='tool_use')break;
      msgs.push({role:'assistant',content:parts});
      const results=await Promise.all(uses.map(async u=>{const tool=tools.find(x=>x.name===u.name);let out;try{out=tool?await tool.execute(u.input||{}):{error:'unknown tool'}}catch(e){out={error:String(e.message||e)}}return{type:'tool_result',tool_use_id:u.id,content:JSON.stringify(out)}}));
      msgs.push({role:'user',content:results});}
    if(opts.onText&&text)opts.onText({text,delta:text});return{text,truncated:false}};
  ai.json=async function(prompt,opts){opts=opts||{};const content=[];for(const f of (opts.images||[])){content.push({type:'image',source:{type:'base64',media_type:f.type||'image/jpeg',data:await fileB64(f)}})}
    content.push({type:'text',text:prompt+'\nReply with JSON only, no other text.'});
    const d=await apiCall({model:AI_MODEL,max_tokens:400,messages:[{role:'user',content}]},opts.signal);
    const t=(d.content||[]).filter(p=>p.type==='text').map(p=>p.text).join('').replace(/^```(?:json)?\s*|\s*```$/g,'').trim();
    try{const m=t.match(/\{[\s\S]*\}/);return JSON.parse(m?m[0]:t)}catch(e){throw aiError('invalid_json')}};
  ai.limits=async()=>({images:true,tools:true});return ai}
const _initAI=initAI;
initAI=async function(){if(window.claude&&window.claude.use)return _initAI();if(!aiAllowed()||!getKey())return;AI=makeKeyAI();AIimg=true;AItools=true;if(S.settings)renderAll()};
function aiKeySheet(){const has=!!getKey();
  openSheet(L('AI features','ميزات الذكاء'),`<form class="sh-form" id="keyform" novalidate><div class="sh-scroll">
    <p class="fhelp" style="margin:0 0 12px">${L('Ask Wafr, receipt scanning and “Read with AI” use Claude. In this version they run on your own Anthropic API key. You pay Anthropic directly for what you use (usually a few fils per receipt).','اسأل وفر وقراءة الإيصالات و"اقرأ بالذكاء" تستخدم Claude. في هالنسخة تشتغل بمفتاح Anthropic API مالك. تدفع لـ Anthropic مباشرة على استخدامك (عادة فلوس قليلة لكل إيصال).')}</p>
    <ol class="steps"><li>${L('Go to <b>console.anthropic.com</b>, sign in, and add a small amount of credit.','روح <b>console.anthropic.com</b>، سجل دخول، وأضف رصيد بسيط.')}</li><li>${L('Open <b>API Keys</b> → <b>Create Key</b>, then copy it.','افتح <b>API Keys</b> ← <b>Create Key</b>، وانسخه.')}</li><li>${L('Paste it below.','الصقه تحت.')}</li></ol>
    <div class="field"><label class="flabel" for="aikey">${L('API key','مفتاح API')}</label><input class="input" id="aikey" name="key" type="password" autocomplete="off" spellcheck="false" placeholder="${has?'••••••••  '+L('saved','محفوظ'):'sk-ant-…'}" data-autofocus>${errHTML('aikey-err')}</div>
    <p class="fine">${L('The key is saved only on this phone. Receipt photos, message text and your spending summary are sent to Anthropic only when you use an AI feature. Anyone with this phone unlocked could use the key — remove it if you share your phone.','المفتاح ينحفظ على هالتلفون بس. صور الإيصالات ونص الرسايل وملخص مصاريفك ترسل لـ Anthropic بس لما تستخدم ميزة ذكاء. أي أحد يفتح تلفونك يقدر يستخدم المفتاح — شيله لو تشارك تلفونك.')}</p>
    <p class="aistat" id="keystat" aria-live="polite"></p>
  </div><div class="sh-actions">${has?`<button class="btn btn-ghost-danger" type="button" data-a="keyDel">${ic('trash')}${L('Remove key','شيل المفتاح')}</button>`:''}<span class="grow"></span><button class="btn btn-pri" type="submit">${L('Save and test','احفظ وجرب')}</button></div></form>`)}
document.addEventListener('submit',async e=>{const f=e.target;if(f.id!=='keyform')return;e.preventDefault();e.stopImmediatePropagation();
  const k=f.key.value.trim();if(!k&&getKey()){closeSheet();return}if(!/^sk-ant-/.test(k)){setErr(f.key,'aikey-err',L('That doesn’t look like an Anthropic key (starts with sk-ant-).','هذا مب شكل مفتاح Anthropic (يبدأ بـ sk-ant-).'));return}
  const st=$('#keystat');st.textContent=L('Testing…','نجرب…');const old=getKey();try{localStorage.setItem(KEY_LS,k)}catch(_){}
  try{await apiCall({model:AI_MODEL,max_tokens:5,messages:[{role:'user',content:'ping'}]});AI=makeKeyAI();AIimg=true;AItools=true;S.settings.privacy={...(S.settings.privacy||{}),ai:true};persist(['settings']);closeSheet();renderAll();toast(L('AI is on ✓','الذكاء شغال ✓'))}
  catch(err){try{old?localStorage.setItem(KEY_LS,old):localStorage.removeItem(KEY_LS)}catch(_){}st.textContent=err.code==='not_granted'?L('Anthropic rejected this key. Check it and try again.','Anthropic رفض المفتاح. تأكد منه وجرب مرة ثانية.'):err.code==='network'?L('No internet connection.','ما في إنترنت.'):L('Could not connect: ','ما قدرنا نتصل: ')+(err.message||'')}},true);
Object.assign(A,{aiKey:()=>aiKeySheet(),keyDel:()=>{try{localStorage.removeItem(KEY_LS)}catch(_){}AI=null;AIimg=false;AItools=false;closeSheet();renderAll();toast(L('Key removed — AI is off','انشال المفتاح — الذكاء مطفي'))}});

/* ---------- SMS: paste button + iPhone automation ---------- */
FLOWS.sms={t:['Read bank SMS automatically','اقرا رسايل البنك تلقائياً'],d:['When your bank texts you about a purchase, your iPhone sends the message to Wafr. Wafr reads the amount and shop, ignores codes and offers, and asks you about anything unclear.','لما يرسلك البنك رسالة شراء، الآيفون يرسلها لوفر. وفر يقرا المبلغ والمحل، يتجاهل الرموز والعروض، ويسألك عن أي شي مب واضح.'],
  steps:[['Open Shortcuts → Automation → + → Message. Leave Sender empty. Tap “Message Contains” and type AED. Choose “Run Immediately”, then Next → New Blank Automation.','افتح الاختصارات ← الأتمتة ← + ← رسالة. خل المرسل فاضي. اضغط "الرسالة تحتوي" واكتب AED. اختار "تشغيل فوراً"، وبعدين التالي ← أتمتة فارغة جديدة.'],
         ['Add “URL Encode” and choose Shortcut Input → Content.','أضف "ترميز URL" واختار مدخل الاختصار ← المحتوى.'],
         ['Add “Open URLs”. Paste the link below and put the URL Encoded text in place of MESSAGE.','أضف "فتح الروابط". الصق الرابط تحت وحط النص المرمّز مكان MESSAGE.'],
         ['Test: send yourself a text like “Purchase of AED 1.00 at Test”, or wait for your next bank SMS.','جرب: أرسل لنفسك رسالة مثل "Purchase of AED 1.00 at Test"، أو انتظر رسالة البنك الجاية.']],link:'#jps-MESSAGE'};

Object.assign(A,{pasteSms:async()=>{const f=$('#expform');if(!f)return;const d=f.querySelector('details.more');if(d)d.open=true;const sb=$('#smsbox');if(!sb)return;
  try{const tx=navigator.clipboard&&navigator.clipboard.readText?await navigator.clipboard.readText():'';if(tx){sb.value=tx;sb.dispatchEvent(new Event('input',{bubbles:true}))}else sb.focus()}catch(e){sb.focus();const st=$('#aistat');if(st)st.textContent=L('Long-press the box below and tap Paste.','اضغط مطولاً على المربع تحت واختار لصق.')}}});
