# Baloot: run every test on each push / pull request that touches the Baloot app.
name: Baloot tests
on:
  push:
    paths: ['baloot/**', 'tests/baloot*', '.github/workflows/baloot-*.yml']
  pull_request:
    paths: ['baloot/**', 'tests/baloot*', '.github/workflows/baloot-*.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install Playwright + Chromium
        run: npm install --no-save --no-audit --no-fund playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: Install AI server dependencies
        run: npm ci --no-audit --no-fund
        working-directory: baloot/ai-worker
      - name: Scoring rules (80)
        run: node tests/baloot.test.js
      - name: Worked scoring examples (36)
        run: node tests/baloot.examples.test.js
      - name: Scoring properties (30,000 random rounds)
        run: node tests/baloot.props.test.js
      - name: AI server (no real key; API faked)
        run: node tests/baloot.worker.test.mjs
      - name: Card reader without AI
        run: node tests/baloot.vision.test.js
      - name: App in a phone-size browser (fake camera, AI faked)
        run: node tests/baloot.ui.test.js
      - name: Speed (phone emulation, CPU slowed)
        run: node tests/baloot.perf.js
