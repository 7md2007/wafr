<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E3F4FC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="بلوت">
<title>حاسبة البلوت</title>
<style>
@font-face{font-family:'IBM Plex Sans Arabic';src:url(../fonts/ibm-plex-sans-arabic-arabic-400-normal.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'IBM Plex Sans Arabic';src:url(../fonts/ibm-plex-sans-arabic-arabic-500-normal.woff2) format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'IBM Plex Sans Arabic';src:url(../fonts/ibm-plex-sans-arabic-arabic-600-normal.woff2) format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:'IBM Plex Sans Arabic';src:url(../fonts/ibm-plex-sans-arabic-arabic-700-normal.woff2) format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:Inter;src:url(../fonts/inter-latin-600-normal.woff2) format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:Inter;src:url(../fonts/inter-latin-700-normal.woff2) format('woff2');font-weight:700;font-display:swap}
/* One light look: sky air on top, white cards, turquoise for every action and selection, soft peach for "them". */
:root{
  --bg:#F2F9FD; --bg-top:#DDF1FB; --surface:#FFFFFF; --surface-2:#F1F7FA; --surface-3:#E7F0F5;
  --ink:#0E2A3A; --ink-2:#56707F; --ink-3:#8DA3B0; --line:#E0ECF2;
  --sky:#2FA8E6; --sky-soft:#E4F3FC;
  --teal:#13B2A5; --teal-deep:#0A877E; --teal-soft:#DCF5F1; --teal-glow:rgba(19,178,165,.28);
  --peach:#FFB48E; --peach-soft:#FFF0E6; --peach-ink:#AD4F25;
  --bad:#D23F3F; --bad-soft:#FDEDED; --on:#FFFFFF; --red-suit:#D9433B;
  --shadow:0 1px 2px rgba(14,42,58,.05),0 6px 20px rgba(14,42,58,.07);
  --f-ar:'IBM Plex Sans Arabic',system-ui,-apple-system,sans-serif; --f-num:Inter,'IBM Plex Sans Arabic',system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.3,.64,1);
  --kb:0px; color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--f-ar);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{background:linear-gradient(180deg,var(--bg-top) 0,var(--bg) 320px) no-repeat,var(--bg)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;gap:14px;
  padding-block:calc(env(safe-area-inset-top,0px) + 8px) calc(env(safe-area-inset-bottom,0px) + 16px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.press{transition:transform .16s var(--ease)}
.press:active{transform:scale(.96)}
svg{display:block;flex:none}

/* top bar */
.top{display:flex;align-items:center;gap:8px;min-height:44px}
.top h1{margin:0;font-size:20px;font-weight:700}
.top .rnd{font-size:13px;color:var(--ink-2);background:var(--surface);border-radius:20px;padding:3px 10px;box-shadow:var(--shadow)}
.top .sp{flex:1}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);background:rgba(255,255,255,.75)}

/* score */
.score{display:grid;grid-template-columns:1fr 64px 1fr;align-items:center}
.side{display:flex;flex-direction:column;align-items:center;gap:2px}
.side .who{font-size:15px;font-weight:600;color:var(--ink-2)}
.side .pts{font:700 58px/1 var(--f-num);letter-spacing:-2px;font-variant-numeric:tabular-nums}
.side.us .pts{color:var(--teal-deep)} .side.them .pts{color:var(--peach-ink)}
.side .bar{width:70%;height:5px;border-radius:3px;background:rgba(14,42,58,.07);overflow:hidden;margin-top:8px}
.side .bar i{display:block;height:100%;transform-origin:right center;transform:scaleX(0);transition:transform .5s var(--ease)}
.side.us .bar i{background:var(--teal)} .side.them .bar i{background:var(--peach)}
.vs{text-align:center;font-size:12px;color:var(--ink-3);line-height:1.25}
.vs b{display:block;font:600 14px var(--f-num);color:var(--ink-2)}
.lead{text-align:center;font-size:13px;color:var(--ink-2);margin-top:-4px}
.editbar{display:flex;align-items:center;gap:10px;background:var(--sky-soft);color:var(--ink);border-radius:14px;padding:8px 8px 8px 12px;font-size:14px;font-weight:600}
.editbar span{flex:1}
.editbar button{height:34px;padding:0 12px;border-radius:10px;background:var(--surface);font-size:13px;font-weight:600;color:var(--ink-2)}

/* current round card */
.round{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:12px}
.rowl{display:grid;grid-template-columns:58px 1fr;align-items:center;gap:8px}
.rowl>.lb{font-size:14px;font-weight:600;color:var(--ink-2)}
/* segmented control: the selected option is filled turquoise, so it reads at a glance */
.seg{position:relative;display:grid;grid-template-columns:repeat(var(--n,2),1fr);background:var(--surface-2);border-radius:14px;padding:4px;--i:0}
.seg::before{content:"";position:absolute;top:4px;bottom:4px;inset-inline-start:4px;width:calc((100% - 8px) / var(--n,2));border-radius:11px;
  background:var(--teal-deep);box-shadow:0 3px 10px var(--teal-glow);transform:translateX(calc(var(--i) * -100%));transition:transform .32s var(--spring)}
.seg.empty::before{opacity:0}
.seg button{position:relative;z-index:1;height:44px;border-radius:11px;font-weight:600;font-size:16px;color:var(--ink-2);transition:color .2s}
.seg button[aria-pressed=true]{color:var(--on)}
.seg.big button{height:52px;font-size:21px;font-weight:700}
.seg.lv button{font-size:15px;padding:0 2px}
.seg.alt::before{background:var(--surface);box-shadow:0 1px 3px rgba(14,42,58,.14),0 4px 10px rgba(14,42,58,.06)}
.seg.alt button[aria-pressed=true]{color:var(--teal-deep)}
.suits{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;overflow:hidden;max-height:90px;transition:max-height .3s var(--ease),opacity .25s,margin .3s var(--ease)}
.suits.off{max-height:0;opacity:0;margin-top:-12px;pointer-events:none}
.suit{position:relative;height:62px;border-radius:15px;background:var(--surface);border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:13px;font-weight:600;color:var(--ink-2);transition:border-color .2s,background .2s,color .2s,transform .16s var(--ease)}
.suit b{font-size:26px;line-height:1;font-weight:400}
.suit.r b{color:var(--red-suit)} .suit.k b{color:var(--ink)}
.suit[aria-pressed=true]{border:2px solid var(--teal-deep);background:var(--teal-soft);color:var(--teal-deep)}
.suit[aria-pressed=true]::after{content:"✓";position:absolute;top:4px;inset-inline-end:6px;width:16px;height:16px;border-radius:8px;background:var(--teal-deep);color:var(--on);font:700 10px/16px var(--f-num);text-align:center}
.suits.need .suit{animation:nudge .45s}
@keyframes nudge{30%{transform:translateX(-5px)}60%{transform:translateX(5px)}}
.hint{font-size:13px;color:var(--ink-3);line-height:1.4}
.projrow{display:flex;align-items:center;gap:10px;min-height:48px;border-radius:14px;background:var(--surface-2);padding:6px 12px;text-align:start;width:100%}
.projrow .t{font-weight:600;color:var(--ink);white-space:nowrap}
.projrow .toks{flex:1;display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.projrow .add{color:var(--ink-3);font-size:14px}
.projrow svg{color:var(--ink-3)}
.tok{font-size:13px;border-radius:9px;padding:2px 8px;background:var(--surface);color:var(--ink-2);white-space:nowrap}
.tok.us{background:var(--teal-soft);color:var(--teal-deep)} .tok.them{background:var(--peach-soft);color:var(--peach-ink)}

/* actions */
.actions{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.scan{position:relative;width:100%;min-height:100px;border-radius:26px;color:var(--on);overflow:hidden;
  background:linear-gradient(135deg,#1EC2B4 0%,var(--teal-deep) 75%);box-shadow:0 12px 28px var(--teal-glow),inset 0 1px 0 rgba(255,255,255,.25);
  display:flex;align-items:center;gap:16px;padding:16px 20px;text-align:start}
.scan::after{content:"";position:absolute;inset:-50% -10% auto auto;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.2),transparent 65%);pointer-events:none}
.scan .cam{width:60px;height:60px;border-radius:19px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.scan .t1{font-size:22px;font-weight:700;display:block}
.scan .t2{font-size:14px;opacity:.9;display:block}
.alt2{display:flex;gap:10px}
.alt2 button{flex:1;height:52px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);font-weight:600;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:8px}
.alt2 .mic{flex:0 0 52px}
.won{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);padding:22px 18px;text-align:center;display:flex;flex-direction:column;gap:12px}
.won .big{font-size:26px;font-weight:700;color:var(--teal-deep)}

/* sheets */
#scrim{position:fixed;inset:0;background:rgba(14,42,58,.32);opacity:0;pointer-events:none;transition:opacity .28s;z-index:20}
#scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:var(--kb);z-index:21;max-width:520px;margin:0 auto;background:var(--surface);border-radius:26px 26px 0 0;
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(16px,env(safe-area-inset-left,0px));
  max-height:calc(100vh - var(--kb) - env(safe-area-inset-top,0px) - 10px);max-height:calc(100dvh - var(--kb) - env(safe-area-inset-top,0px) - 10px);
  overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;transform:translateY(105%);visibility:hidden;
  transition:transform .34s var(--ease),visibility 0s .34s;box-shadow:0 -10px 40px rgba(14,42,58,.16)}
.sheet.on{transform:none;visibility:visible;transition:transform .34s var(--ease)}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 8px}
.sh-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sh-h h2{margin:0;font-size:19px;font-weight:700;flex:1;min-width:0}
.sh-x{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2);flex:none}
.pillbtn{height:36px;padding:0 12px;border-radius:18px;background:var(--surface-2);display:flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--ink-2)}
.stack{display:flex;flex-direction:column;gap:12px}
.note{font-size:13px;color:var(--ink-2);line-height:1.5}
.err{background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:9px 12px;font-size:14px}
.warn{background:var(--peach-soft);color:var(--peach-ink);border-radius:12px;padding:9px 12px;font-size:14px}
.go{width:100%;height:56px;border-radius:18px;background:var(--teal-deep);color:var(--on);font-size:18px;font-weight:700;transition:opacity .2s,transform .16s var(--ease)}
.go:disabled{opacity:.35}
.go.danger{background:var(--bad)}
.soft{width:100%;height:48px;border-radius:14px;background:var(--surface-2);font-weight:600;color:var(--ink)}
.opt{display:flex;flex-direction:column;gap:6px}
.opt .lb{font-size:13px;color:var(--ink-2);font-weight:600}

/* result preview (same numbers the engine saves) */
.result{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface-2);border-radius:16px;padding:10px 14px;min-height:60px}
.result .st{font-size:15px;font-weight:700;min-width:0}
.result .st small{display:block;font-weight:400;color:var(--ink-2);font-size:12px;line-height:1.4}
.st.ok{color:var(--teal-deep)} .st.bad{color:var(--bad)} .st.tie{color:var(--peach-ink)}
.result .sc{display:flex;gap:14px;font:700 24px var(--f-num);flex:none}
.result .sc span{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.result .sc em{font:600 11px var(--f-ar);font-style:normal;color:var(--ink-2)}
.result .sc .u{color:var(--teal-deep)} .result .sc .t{color:var(--peach-ink)}
.lvtag{display:inline-block;background:var(--peach-ink);color:var(--on);border-radius:7px;padding:0 6px;font-size:11px;font-weight:700;margin-inline-start:4px;vertical-align:1px}

/* card grid */
.grid{display:grid;grid-template-columns:24px repeat(8,1fr);gap:4px}
.grid .sl{display:grid;place-items:center;font-size:19px}
.grid .sl.r{color:var(--red-suit)}
.cd{height:44px;border-radius:9px;background:var(--surface-2);font:600 15px var(--f-num);color:var(--ink-3);border:1.5px solid transparent;transition:background .15s,color .15s,transform .15s var(--spring)}
.cd:active{transform:scale(.92)}
.cd.on{background:var(--surface);color:var(--ink);border-color:var(--teal);box-shadow:0 2px 6px var(--teal-glow)}
.cd.on.r{color:var(--red-suit)}
.cd.ai::after{content:"";display:block;width:4px;height:4px;border-radius:2px;background:var(--sky);margin:1px auto 0}
.pilehead{display:flex;align-items:center;gap:10px}
.pilehead .thumbs{display:flex;gap:6px}
.pilehead img{width:44px;height:44px;border-radius:10px;object-fit:cover}
.addph{width:44px;height:44px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--teal-deep)}
.stat{font-size:14px;color:var(--ink-2);flex:1;min-width:0}
.stat b{color:var(--ink);font-family:var(--f-num)}
.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--sky-soft);border-top-color:var(--sky);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px;margin-inline-end:6px}
@keyframes sp{to{transform:rotate(360deg)}}

/* photo source sheet + preview */
.srcs{display:flex;flex-direction:column;gap:10px}
.src{display:flex;align-items:center;gap:14px;min-height:68px;border-radius:18px;background:var(--surface-2);padding:10px 14px;text-align:start;width:100%}
.src .ic{width:46px;height:46px;border-radius:14px;background:var(--teal-soft);color:var(--teal-deep);display:grid;place-items:center;flex:none}
.src b{display:block;font-size:17px;font-weight:700}
.src small{display:block;font-size:13px;color:var(--ink-2)}
.src:disabled{opacity:.45}
.src.plain .ic{background:var(--surface);color:var(--ink-2)}
.pv{position:relative;border-radius:18px;overflow:hidden;background:var(--surface-2);min-height:120px;display:grid;place-items:center}
.pv img{display:block;width:100%;max-height:200px;object-fit:contain;background:#0E2A3A}
.pv .ov{position:absolute;inset-inline-start:10px;bottom:10px;background:rgba(14,42,58,.78);color:var(--on);border-radius:10px;padding:4px 10px;font-size:13px;font-weight:600}
.pv .ov.bad{background:var(--bad)}
.pvacts{display:flex;gap:8px;flex-wrap:wrap}
.pvacts button{flex:1;min-width:0;height:42px;border-radius:12px;background:var(--surface-2);font-size:14px;font-weight:600;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;padding:0 8px}
.pvacts .del{flex:0 0 42px;color:var(--bad)}
.pthumbs{display:flex;gap:6px;overflow-x:auto}
.pthumbs button{width:52px;height:52px;border-radius:10px;overflow:hidden;flex:none;border:2px solid transparent;padding:0;background:var(--surface-2)}
.pthumbs button.on{border-color:var(--teal-deep)}
.pthumbs img{width:100%;height:100%;object-fit:cover;display:block}

/* manual keypad */
.display{display:flex;flex-direction:column;align-items:center;gap:6px;padding:2px 0}
.display .big{font:700 54px/1.05 var(--f-num);letter-spacing:-1.5px;color:var(--ink);min-height:57px}
.display .big.ph{color:var(--ink-3)}
.display .big.kab{font:700 34px/57px var(--f-ar);letter-spacing:0;color:var(--teal-deep)}
.split{display:flex;gap:8px}
.split span{border-radius:10px;padding:3px 10px;font-size:14px;font-weight:600}
.split .u{background:var(--teal-soft);color:var(--teal-deep)} .split .t{background:var(--peach-soft);color:var(--peach-ink)}
.split .on{box-shadow:0 0 0 2px currentColor inset}
.kabrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kabrow button{height:44px;border-radius:12px;background:var(--surface-2);font-weight:600;color:var(--ink-2);font-size:15px;transition:background .15s,color .15s}
.kabrow button[aria-pressed=true]{background:var(--teal-deep);color:var(--on)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;direction:ltr} /* ltr on purpose: 1 2 3 left to right, مسح 0 ⌫ on the last row */
.keys button{height:58px;border-radius:15px;background:var(--surface-2);font:600 26px var(--f-num);color:var(--ink);transition:background .08s,transform .1s var(--ease)}
.keys button:active{background:var(--surface-3);transform:scale(.95)}
.keys .k2{font:600 16px var(--f-ar);color:var(--ink-2)}
.voice{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}
.voice:empty{display:none}

/* projects sheet */
.ptiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ptile{position:relative;height:66px;border-radius:16px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:background .15s,opacity .2s,transform .16s var(--ease)}
.ptile b{font-size:18px;font-weight:700}
.ptile small{font:600 13px var(--f-num);color:var(--ink-2)}
.ptile:disabled{opacity:.35}
.ptile .cnt{position:absolute;top:6px;inset-inline-end:8px;min-width:22px;height:22px;border-radius:11px;font:700 12px/22px var(--f-num);color:var(--on);text-align:center}
.ptiles.us .cnt{background:var(--teal-deep)} .ptiles.them .cnt{background:var(--peach-ink)}
.ptiles.us .ptile:active{background:var(--teal-soft)} .ptiles.them .ptile:active{background:var(--peach-soft)}
.plist{display:flex;flex-wrap:wrap;gap:6px}
.plist:empty{display:none}
.pchip{display:flex;align-items:center;gap:4px;height:36px;border-radius:18px;padding:0 6px 0 12px;font-size:14px;font-weight:600}
.pchip.us{background:var(--teal-soft);color:var(--teal-deep)} .pchip.them{background:var(--peach-soft);color:var(--peach-ink)}
.pchip.x{opacity:.5;text-decoration:line-through}
.pchip button{width:26px;height:26px;border-radius:13px;display:grid;place-items:center;background:rgba(255,255,255,.7)}
.ptot{display:flex;gap:8px}
.ptot div{flex:1;border-radius:14px;padding:8px 12px}
.ptot .u{background:var(--teal-soft);color:var(--teal-deep)} .ptot .t{background:var(--peach-soft);color:var(--peach-ink)}
.ptot small{display:block;font-size:12px;font-weight:600;opacity:.85}
.ptot b{font:700 20px var(--f-num)}

/* history */
.hl{display:flex;flex-direction:column}
.hr{display:grid;grid-template-columns:26px 1fr 38px 38px 36px;gap:6px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px;text-align:start;width:100%}
.hr:first-child{border-top:0}
.hr .i{font:600 13px var(--f-num);color:var(--ink-3);text-align:center}
.hr .d{min-width:0}
.hr .d small{display:block;color:var(--ink-2);font-size:12px}
.hr .p{font:700 17px var(--f-num);text-align:center}
.hr .p.u{color:var(--teal-deep)} .hr .p.t{color:var(--peach-ink)}
.hr .del{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--ink-3)}
.hr .edit{display:block;text-align:start;min-width:0;border-radius:10px}
.empty{color:var(--ink-2);text-align:center;padding:18px 0;font-size:14px}
input.key{width:100%;height:48px;border-radius:12px;border:1.5px solid var(--line);padding:0 12px;font:16px var(--f-num);direction:ltr;background:var(--surface);color:var(--ink)}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:30;transform:translate(-50%,140%);opacity:0;pointer-events:none;
  transition:transform .35s var(--spring),opacity .2s;background:var(--ink);color:var(--on);border-radius:16px;padding:12px 14px;
  display:flex;align-items:center;gap:14px;font-size:15px;box-shadow:0 10px 30px rgba(14,42,58,.3);width:max-content;max-width:calc(100% - 32px)}
#toast.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
#toast button{color:#7FE6DA;font-weight:700;min-height:32px}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important}}
@media (max-height:720px){.side .pts{font-size:48px}.scan{min-height:84px}.scan .cam{width:50px;height:50px}.app{gap:10px}.suit{height:56px}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top">
    <h1>بلوت</h1><span class="rnd" id="rnd">الجولة 1</span><span class="sp"></span>
    <button class="ib press" id="bHist" aria-label="الجولات"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg></button>
    <button class="ib press" id="bShare" aria-label="مشاركة النتيجة"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg></button>
    <button class="ib press" id="bMore" aria-label="الإعدادات"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
  </div>

  <div class="score">
    <div class="side us"><span class="who">لنا</span><span class="pts" id="sUs">0</span><span class="bar"><i id="bUs"></i></span></div>
    <div class="vs">الصكة<b id="tgt">152</b></div>
    <div class="side them"><span class="who">لهم</span><span class="pts" id="sThem">0</span><span class="bar"><i id="bThem"></i></span></div>
  </div>
  <div class="lead" id="lead"></div>
  <div id="editBar"></div>

  <section class="round" id="roundCard" aria-label="الجولة الحالية">
    <div class="seg big" id="segMode"><button data-v="sun">صن</button><button data-v="hokm">حكم</button></div>
    <div class="suits off" id="suits"></div>
    <div class="rowl"><span class="lb">المشتري</span><div class="seg" id="segBuyer"><button data-v="us">لنا</button><button data-v="them">لهم</button></div></div>
    <div class="rowl"><span class="lb">الدبل</span><div id="lvBox"></div></div>
    <button class="projrow press" id="bProj"></button>
  </section>

  <div class="actions" id="actions">
    <button class="scan press" id="bScan">
      <span class="cam"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="4"/></svg></span>
      <span><span class="t1">صوّر الأوراق</span><span class="t2" id="scanSub">صوّر أكلات فريقك ونحسب الجولة</span></span>
    </button>
    <div class="alt2">
      <button class="press" id="bManual"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h2M12 12h2M8 16h2M12 16h2"/></svg>إدخال يدوي</button>
      <button class="press mic" id="bMic" aria-label="إدخال بالصوت" hidden><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    </div>
  </div>
  <div id="wonBox"></div>
</div>

<div id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sb"></div></div>
<div id="toast" role="status" aria-live="polite"><span id="tMsg"></span><button id="tAct" hidden></button></div>
<input type="file" id="photoCam" accept="image/*" capture="environment" hidden>
<input type="file" id="photoLib" accept="image/*,.heic,.heif,.jpg,.jpeg,.png" hidden>

<script src="engine.js"></script>
<script>
'use strict';
const E = BalootEngine;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const TEAM = { us: 'لنا', them: 'لهم' };
const OTHER = t => (t === 'us' ? 'them' : 'us');
const SUIT = { S: ['♠', 'سبيت', 'k'], H: ['♥', 'هاص', 'r'], D: ['♦', 'ديمن', 'r'], C: ['♣', 'كلفس', 'k'] };
const LV = E.LEVELS;
const haptic = () => { try { navigator.vibrate && navigator.vibrate(8); } catch (e) {} };
const X_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';

/* ---------- state (saved on every change, restored on refresh) ---------- */
const LS = 'baloot.v1';
const blankCur = c => ({ mode: (c && c.mode) || 'sun', trump: (c && c.trump) || null, buyer: (c && c.buyer) || 'us', level: 'normal', projects: [], tieWinner: null });
let S = { v: 3, rounds: [], games: [], target: 152, tieRule: E.DEFAULTS.tieRule,
  rules: { sunDouble: E.DEFAULTS.sunDouble, projMult: E.DEFAULTS.projMult, kabootMult: E.DEFAULTS.kabootMult },
  cur: blankCur(), edit: null };
function cleanCur(c) {
  c = c || {};
  return { mode: c.mode === 'hokm' ? 'hokm' : 'sun', trump: E.SUITS.includes(c.trump) ? c.trump : null, buyer: c.buyer === 'them' ? 'them' : 'us',
    level: LV[c.level] ? c.level : 'normal',
    projects: Array.isArray(c.projects) ? c.projects.filter(p => p && E.PROJECTS[p.type] && (p.team === 'us' || p.team === 'them')).map(p => ({ type: p.type, team: p.team })) : [],
    tieWinner: c.tieWinner === 'us' || c.tieWinner === 'them' ? c.tieWinner : null };
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(LS) || 'null');
    if (!s) return;
    if (!s.v) { s.cur = { mode: s.prefs && s.prefs.mode, trump: s.prefs && s.prefs.trump, buyer: s.prefs && s.prefs.buyer }; delete s.prefs; } // v1
    S = Object.assign(S, s, { v: 3 });
    S.rules = Object.assign({ sunDouble: E.DEFAULTS.sunDouble, projMult: E.DEFAULTS.projMult, kabootMult: E.DEFAULTS.kabootMult }, s.rules || {});
    S.rounds = (S.rounds || []).filter(r => r && Number.isFinite(r.us) && Number.isFinite(r.them)).map(r => Object.assign({ level: 'normal' }, r));
    S.games = Array.isArray(S.games) ? S.games : [];
    S.cur = cleanCur(S.cur);
    if (S.edit && !(S.edit.i >= 0 && S.edit.i < S.rounds.length)) S.edit = null;
  } catch (e) {}
}
const save = () => { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} };
load();
const C = () => S.cur;
const sumRounds = list => list.reduce((t, r) => ({ us: t.us + r.us, them: t.them + r.them }), { us: 0, them: 0 });
const totals = () => sumRounds(S.rounds);
// the match score before the round being entered (the edited round's own points don't count)
const before = () => sumRounds(S.edit ? S.rounds.slice(0, S.edit.i) : S.rounds);
const projName = t => E.PROJECTS[t].ar;
const needTrump = () => C().mode === 'hokm' && !C().trump;
const modeLabel = r => (r.mode === 'sun' ? 'صن' : 'حكم ' + (SUIT[r.trump] ? SUIT[r.trump][0] : ''));
const levelOpts = () => E.doublingOptions(C().mode, C().buyer, before(), S.rules);
const gameWon = () => { const t = totals(); return (t.us >= S.target || t.them >= S.target) && t.us !== t.them && !S.edit; };
function fixLevel() { if (!levelOpts().includes(C().level)) C().level = 'normal'; }

/* ---------- home ---------- */
const shown = { us: 0, them: 0 };
function countTo(el, from, to) {
  if (from === to || matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = to; return; }
  const t0 = performance.now(), d = 420;
  const step = t => { const k = Math.min(1, (t - t0) / d), e = 1 - Math.pow(1 - k, 3); el.textContent = Math.round(from + (to - from) * e); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function setSeg(el, val, vals) {
  const i = vals.indexOf(val);
  el.style.setProperty('--n', vals.length);
  el.classList.toggle('empty', i < 0);
  el.style.setProperty('--i', Math.max(0, i));
  el.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === val)));
}
$('#suits').innerHTML = E.SUITS.map(s => `<button class="suit ${SUIT[s][2]} press" data-v="${s}" aria-label="الحكم ${SUIT[s][1]}"><b>${SUIT[s][0]}</b>${SUIT[s][1]}</button>`).join('');

function renderLevels() {
  const c = C(), opts = levelOpts(), box = $('#lvBox');
  if (opts.length < 2) {
    box.dataset.k = '';
    box.innerHTML = `<span class="hint">${c.mode === 'sun' ? (S.rules.sunDouble === 'off' ? 'الدبل في الصن مقفل من الإعدادات' : 'في الصن يصير الدبل إذا المشتري 100 وفوق والثاني تحت 100') : ''}</span>`;
    return;
  }
  const key = opts.join(',');
  if (box.dataset.k !== key) {
    box.dataset.k = key;
    box.innerHTML = `<div class="seg lv" id="segLv">${opts.map(l => `<button data-v="${l}">${LV[l].ar}</button>`).join('')}</div>`;
  }
  setSeg($('#segLv'), c.level, opts);
}
function renderProjRow() {
  const c = C(), n = c.projects.length;
  const toks = c.projects.map(p => `<span class="tok ${p.team}">${projName(p.type)} ${TEAM[p.team]}</span>`).join('');
  $('#bProj').innerHTML = `<span class="t">المشاريع</span><span class="toks">${n ? toks : '<span class="add">ما فيه — اضغط للإضافة</span>'}</span>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg>`;
}
function renderHome() {
  const t = totals(), tg = S.target;
  countTo($('#sUs'), shown.us, t.us); countTo($('#sThem'), shown.them, t.them); shown.us = t.us; shown.them = t.them;
  $('#bUs').style.transform = `scaleX(${Math.min(1, t.us / tg)})`; $('#bThem').style.transform = `scaleX(${Math.min(1, t.them / tg)})`;
  $('#tgt').textContent = tg;
  $('#rnd').textContent = 'الجولة ' + (S.edit ? S.edit.i + 1 : S.rounds.length + 1);
  const d = t.us - t.them;
  const wins = S.games.length ? ` · الصكات ${S.games.filter(x => x.w === 'us').length}–${S.games.filter(x => x.w === 'them').length}` : '';
  $('#lead').textContent = (S.rounds.length ? (d === 0 ? 'متعادلين' : `${d > 0 ? 'متقدمين' : 'متأخرين'} بـ ${Math.abs(d)}`) : 'صكة جديدة') + wins;
  $('#editBar').innerHTML = S.edit ? `<div class="editbar"><span>تعدّل الجولة ${S.edit.i + 1}</span><button data-a="editOpen">الأبناط</button><button data-a="editCancel">إلغاء</button></div>` : '';
  const won = gameWon();
  $('#roundCard').hidden = won; $('#actions').hidden = won;
  $('#wonBox').innerHTML = won ? `<div class="won"><div class="big">🎉 الصكة ${t.us > t.them ? 'لنا' : 'لهم'}</div><div class="note">${t.us} – ${t.them}${S.rounds.length && S.rounds[S.rounds.length - 1].gahwa ? ' · بالقهوة' : ''}</div>
    <button class="go press" data-a="newGameNow">صكة جديدة</button><button class="soft press" data-a="undo">تراجع عن آخر جولة</button></div>` : '';
  if (won) return;
  const c = C();
  fixLevel();
  setSeg($('#segMode'), c.mode, ['sun', 'hokm']);
  setSeg($('#segBuyer'), c.buyer, ['us', 'them']);
  $('#suits').classList.toggle('off', c.mode !== 'hokm');
  $('#suits').querySelectorAll('.suit').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === c.trump)));
  renderLevels(); renderProjRow();
}

/* ---------- round input → engine (the preview and the saved round use the same call) ---------- */
function score(extra) {
  const c = C(), b = before();
  return E.scoreRound(Object.assign({ mode: c.mode, trump: c.trump, buyer: c.buyer, projects: c.projects, tieWinner: c.tieWinner,
    tieRule: S.tieRule, level: c.level, rules: S.rules, match: { us: b.us, them: b.them, target: S.target }, kaboot: null }, extra));
}
function resultHTML(r) {
  if (!r) return `<div class="result"><span class="st" style="color:var(--ink-3)">النتيجة تظهر هنا</span></div>`;
  if (r.error) {
    const m = r.error === 'needTie' ? 'نفس المشروع عند الفريقين — حدد الأعلى من «المشاريع»' : r.error === 'trump' ? 'اختر الحكم أول' : r.error === 'abnat' ? 'الرقم غير صحيح' : r.error === 'level' ? 'مستوى الدبل غير متاح' : 'راجع المشاريع';
    return `<div class="err">${m}</div>`;
  }
  const st = r.gahwa ? ['ok', `القهوة ${TEAM[r.gahwa]} — تنتهي الصكة`] : r.made === true ? ['ok', 'المشتري نجح'] : r.made === 'tie' ? ['tie', 'تعادل'] : ['bad', 'المشتري خسر'];
  if (r.gahwa && r.gahwa !== C().buyer) st[0] = 'bad';
  const tag = r.level !== 'normal' ? `<span class="lvtag">${LV[r.level].ar}${r.mult > 1 ? ' ×' + r.mult : ''}</span>` : '';
  const sub = [`اشترى ${TEAM[C().buyer]}`, r.kaboot ? 'كبوت ' + TEAM[r.kaboot] : '', r.cancelled.length ? 'ملغي: ' + r.cancelled.map(p => projName(p.type)).join('، ') : ''].filter(Boolean).join(' · ');
  return `<div class="result"><span class="st ${st[0]}">${st[1]}${tag}<small>${sub}</small></span>
    <span class="sc"><span class="u"><bdi dir="ltr">+${r.us}</bdi><em>لنا</em></span><span class="t"><bdi dir="ltr">+${r.them}</bdi><em>لهم</em></span></span></div>`;
}
let lastSaved = null, saving = false;
function commit(r, how) {
  if (saving) return; // one tap = one round
  saving = true; setTimeout(() => { saving = false; }, 600);
  const c = C();
  const round = { mode: c.mode, trump: c.mode === 'hokm' ? c.trump : null, buyer: c.buyer, level: c.level, abnat: r.kaboot ? null : r.abnat.us, kaboot: r.kaboot, how,
    entered: c.projects.slice(), tieWinner: c.tieWinner, projects: r.valid.map(p => ({ type: p.type, team: p.team })),
    us: r.us, them: r.them, made: r.made, gahwa: r.gahwa || null, at: Date.now() };
  let msg;
  if (S.edit) {
    const i = S.edit.i, old = S.rounds[i];
    S.rounds[i] = round; S.cur = cleanCur(S.edit.cur); S.edit = null;
    lastSaved = { kind: 'edit', i, old };
    msg = `عدّلنا الجولة ${i + 1}`;
  } else {
    S.rounds.push(round);
    lastSaved = { kind: 'add', round, cur: JSON.parse(JSON.stringify(c)) };
    S.cur = blankCur(c); // projects and doubling never carry over to the next round
    msg = r.gahwa ? `قهوة — الصكة ${TEAM[r.gahwa]}` : `سجلنا: لنا \u2066+${r.us}\u2069 · لهم \u2066+${r.them}\u2069`;
  }
  save(); closeSheet(); haptic(); renderHome();
  toast(msg, 'تراجع', undoLast);
}
function undoLast() {
  if (lastSaved && lastSaved.kind === 'edit') { S.rounds[lastSaved.i] = lastSaved.old; lastSaved = null; save(); renderHome(); toast('رجّعنا الجولة كما كانت'); return; }
  if (!S.rounds.length) return;
  const r = S.rounds.pop();
  if (lastSaved && lastSaved.kind === 'add' && lastSaved.round === r) S.cur = cleanCur(lastSaved.cur);
  lastSaved = null; save(); renderHome(); toast('رجعنا آخر جولة');
}
function newGame(skipAsk) {
  const go = () => {
    const t = totals();
    if (S.rounds.length) S.games.push({ us: t.us, them: t.them, w: t.us === t.them ? null : (t.us > t.them ? 'us' : 'them'), rounds: S.rounds, at: Date.now() });
    if (S.games.length > 30) S.games = S.games.slice(-30);
    S.rounds = []; S.edit = null; S.cur = blankCur(C()); lastSaved = null; save(); closeSheet(); renderHome(); toast('صكة جديدة');
  };
  if (skipAsk || !S.rounds.length) go(); else ask('تبدأ صكة جديدة؟', 'النتيجة الحالية تنحفظ في السجل.', 'ابدأ صكة جديدة', go);
}
/* edit an earlier round: its setup is loaded into the round card; saving replaces it in place */
function startEdit(i) {
  const r = S.rounds[i]; if (!r) return;
  if (!S.edit) S.edit = { i, cur: JSON.parse(JSON.stringify(C())) }; else S.edit.i = i;
  S.cur = cleanCur({ mode: r.mode, trump: r.trump, buyer: r.buyer, level: r.level, projects: r.entered || r.projects, tieWinner: r.tieWinner });
  save(); closeSheet(); renderHome();
  setTimeout(() => manualSheet(r.kaboot ? { kaboot: r.kaboot } : { team: 'us', val: r.abnat != null ? String(r.abnat) : '' }), 360);
}
function cancelEdit() { if (!S.edit) return; S.cur = cleanCur(S.edit.cur); S.edit = null; save(); closeSheet(); renderHome(); }

/* ---------- sheets ---------- */
let SK = null; // which sheet is open
function openSheet(kind, html) {
  SK = kind; $('#sb').innerHTML = html;
  const sh = $('#sheet'); sh.scrollTop = 0;
  $('#scrim').classList.add('on'); sh.classList.add('on');
}
function closeSheet() {
  if (!SK) return;
  SK = null; $('#scrim').classList.remove('on'); $('#sheet').classList.remove('on');
  $('#sheet').style.transform = ''; if (REC) { try { REC.abort(); } catch (e) {} }
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
}
const head = (t, extra) => `<div class="sh-h"><h2>${t}</h2>${extra || ''}<button class="sh-x press" data-a="close" aria-label="إغلاق">${X_SVG}</button></div>`;
let ASKFN = null;
function ask(title, body, yes, fn) {
  ASKFN = fn;
  openSheet('ask', `${head(title)}<div class="stack"><div class="note">${body}</div><button class="go danger press" data-a="askYes">${yes}</button><button class="soft press" data-a="close">إلغاء</button></div>`);
}
// swipe down to close: from the handle/header, or anywhere while the sheet is scrolled to the top
(() => {
  const sh = $('#sheet'); let y0 = null, dy = 0, t0 = 0, claimed = false;
  sh.addEventListener('touchstart', e => {
    if (sh.scrollTop > 0 || e.target.closest('.grid,.keys,.ptiles,input')) { y0 = null; return; }
    y0 = e.touches[0].clientY; dy = 0; t0 = Date.now(); claimed = false;
  }, { passive: true });
  sh.addEventListener('touchmove', e => {
    if (y0 == null) return; dy = e.touches[0].clientY - y0;
    if (dy <= 0 && !claimed) { y0 = null; return; } // scrolling up: let the sheet scroll
    claimed = true; dy = Math.max(0, dy);
    sh.style.transition = 'none'; sh.style.transform = `translateY(${dy}px)`; if (e.cancelable) e.preventDefault();
  }, { passive: false });
  sh.addEventListener('touchend', () => {
    if (y0 == null) return; sh.style.transition = ''; const fast = dy / Math.max(1, Date.now() - t0) > .5;
    if (claimed && (dy > 110 || (fast && dy > 30))) closeSheet(); else sh.style.transform = '';
    y0 = null;
  });
})();
// keep the open sheet above the iPhone keyboard
if (window.visualViewport) {
  const kb = () => { const v = visualViewport; const h = Math.max(0, Math.round(innerHeight - v.height - v.offsetTop)); document.documentElement.style.setProperty('--kb', (h > 60 ? h : 0) + 'px'); };
  visualViewport.addEventListener('resize', kb); visualViewport.addEventListener('scroll', kb);
}

/* ---------- toast ---------- */
let TT = null, TFN = null;
function toast(msg, act, fn) {
  $('#tMsg').textContent = msg; const b = $('#tAct'); b.hidden = !act; b.textContent = act || ''; TFN = fn || null;
  $('#toast').classList.add('on'); clearTimeout(TT); TT = setTimeout(() => { $('#toast').classList.remove('on'); TFN = null; }, act ? 5000 : 2200);
}
$('#tAct').onclick = () => { $('#toast').classList.remove('on'); const f = TFN; TFN = null; if (f) f(); };

/* ---------- projects sheet: pick a team, tap a project to add it ---------- */
let PT = null; // team that receives the next project tap
function hasSameBest() {
  const big = C().projects.filter(p => p.type !== 'baloot');
  const best = team => Math.max(0, ...big.filter(p => p.team === team).map(p => E.PROJECTS[p.type].rank));
  const u = best('us'), t = best('them'); return u > 0 && u === t;
}
function projSheet() {
  if (!PT) PT = C().buyer;
  openSheet('proj', `${head('المشاريع')}<div class="stack">
    <div class="seg alt" id="segPT"><button data-a="pTeam2" data-v="us">لنا</button><button data-a="pTeam2" data-v="them">لهم</button></div>
    <div class="ptiles" id="pTiles"></div>
    <div class="plist" id="pList"></div>
    <div id="pTie"></div>
    <div class="ptot" id="pTot"></div>
    <div class="note" id="pNote"></div>
    <button class="go press" data-a="close">تم</button></div>`);
  projUpdate();
}

  const ov = !ph ? '' : ph.state === 'reading' ? '<span class="ov"><span class="spin"></span>نقرأ الأوراق…</span>' : ph.state === 'err' ? '<span class="ov bad">ما انقرت</span>' : `<span class="ov">${ph.cards.size} ورقة من هذي الصورة</span>`;
  const preview = ph ? `<div class="pv"><img src="${ph.url}" alt="صورة الأوراق">${ov}</div>
      ${P.photos.length > 1 ? `<div class="pthumbs">${P.photos.map((x, i) => `<button class="${x === ph ? 'on' : ''}" data-a="showPhoto" data-v="${i}" aria-label="صورة ${i + 1}"><img src="${x.url}" alt=""></button>`).join('')}</div>` : ''}
      <div class="pvacts">
        <button class="press" data-a="retake" data-v="${ph.id}">${ph.src === 'cam' ? CAM_SVG.replace(/24/g, '18') + 'إعادة التصوير' : LIB_SVG.replace(/24/g, '18') + 'صورة ثانية بدلها'}</button>
        <button class="press" data-a="addPhoto"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>صورة إضافية</button>
        <button class="press del" data-a="delPhoto" data-v="${ph.id}" aria-label="احذف الصورة"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>
      </div>
      ${ph.state === 'err' ? `<div class="err">${ph.err}</div>` : ''}` : (noAI ? '' : `<button class="soft press" data-a="addPhoto">صوّر أو اختر صورة</button>`);
  openSheet('pile', `${head(`الأكلات <span class="hint" style="font-size:13px;font-weight:600">· ${modeLabel(c)}${lvl}</span>`)}
    <div class="stack">
      <div class="seg alt" id="segPile"><button data-a="pTeam" data-v="us">أكلاتنا</button><button data-a="pTeam" data-v="them">أكلاتهم</button></div>
      ${preview}
      <span class="stat" id="pStat">${status}</span>
      ${noAI ? `<div class="note">قراءة الصور تحتاج Claude${window.claude ? '' : ' أو مفتاح Anthropic (من ⋯)'}. اختر الأوراق هنا وتنحسب مباشرة.</div>` : ''}
      ${P.err ? `<div class="err">${P.err}</div>` : ''}${P.unread ? `<div class="warn">فيه ${P.unread} ورقة ما انقرت — أضفها بالضغط عليها.</div>` : ''}
      ${P.cards.size || P.photos.length ? '<div class="note">تحقق من الأوراق: اضغط على ورقة غلط لإلغائها، أو على ورقة ناقصة لإضافتها. النقطة الزرقاء = قرأها الذكاء.</div>' : ''}
      <div class="grid" id="pGrid">${cells}</div>
      <div id="pLast"></div>
      <div id="pRes"></div>
      <button class="go press" id="pGo" data-a="pSave">سجّل الجولة</button>
    </div>`);
  pileUpdate();
}
function pileUpdate() {
  if (SK !== 'pile') return;
  setSeg($('#segPile'), P.team, ['us', 'them']);
  const o = pileCalc(), n = P.cards.size;
  $('#pLast').innerHTML = (n && n % 4 === 0 && n < 32) ? `<div class="opt"><span class="lb">الأرض (آخر أكلة +10) — مين أخذها؟</span><div class="seg alt" id="segLast"><button data-a="pLast" data-v="us">لنا</button><button data-a="pLast" data-v="them">لهم</button></div></div>` : '';
  const sl = $('#segLast'); if (sl) setSeg(sl, P.last, ['us', 'them']);
  if (!busy() && n) $('#pStat').innerHTML = `<b>${n}</b> ورقة · <b>${o.ab != null ? o.ab : '…'}</b> بنط`;
  $('#pRes').innerHTML = o.err ? `<div class="err">${o.err}</div>` : o.warn ? `<div class="warn">${o.warn}</div>` : o.needLast ? '' : resultHTML(o.r);
  const go = $('#pGo'); go.disabled = !(o.r && !o.r.error) || busy();
  go.textContent = o.needLast ? 'حدد مين أخذ الأرض' : (S.edit ? 'احفظ التعديل' : 'سجّل الجولة');
}
function nudgeSuits() {
  const s = $('#suits'); s.classList.remove('need'); void s.offsetWidth; s.classList.add('need');
  toast('اختر الحكم أول');
}

/* ---------- history / settings / share ---------- */
function histSheet() {
  const rows = S.rounds.map((r, i) => ({ r, i })).reverse().map(({ r, i }) => {
    const st = r.gahwa ? ' · قهوة' : r.made === true ? '' : r.made === 'tie' ? ' · تعادل' : ' · خسر';
    const lv = r.level && r.level !== 'normal' && r.level !== 'gahwa' ? ' · ' + LV[r.level].ar : '';
    const pj = r.projects && r.projects.length ? r.projects.map(p => projName(p.type) + ' ' + TEAM[p.team]).join('، ') : '';
    const det = r.kaboot ? 'كبوت ' + TEAM[r.kaboot] : (r.abnat != null ? `أبناط لنا ${r.abnat}` : '');
    return `<div class="hr"><span class="i">${i + 1}</span><button class="d edit" data-a="edit" data-v="${i}" aria-label="عدّل الجولة ${i + 1}">${modeLabel(r)}${lv} · اشترى ${TEAM[r.buyer]}${st}<small>${[det, pj].filter(Boolean).join(' · ')}</small></button>
      <span class="p u">${r.us}</span><span class="p t">${r.them}</span><button class="del press" data-a="del" data-v="${i}" aria-label="احذف الجولة ${i + 1}">${X_SVG}</button></div>`;
  }).join('');
  const t = totals();
  openSheet('hist', `${head('الجولات')}<div class="stack">
    ${S.rounds.length ? `<div class="hr" style="border:0;padding:0;color:var(--ink-2);font-size:13px"><span></span><span>المجموع · اضغط على جولة لتعديلها</span><span class="p u">${t.us}</span><span class="p t">${t.them}</span><span></span></div>` : ''}
    <div class="hl">${rows || '<div class="empty">ما فيه جولات للحين</div>'}</div>
    ${S.rounds.length ? '<button class="soft press" data-a="undo">تراجع عن آخر جولة</button>' : ''}
    ${S.games.length ? `<div class="note">صكات سابقة: ${S.games.slice().reverse().slice(0, 5).map(g => `${g.w ? TEAM[g.w] : 'تعادل'} (${g.us}–${g.them})`).join(' · ')}</div>` : ''}
  </div>`);
}
function moreSheet() {
  openSheet('more', `${head('الإعدادات')}<div class="stack">
    <div class="opt"><span class="lb">الصكة على</span><div class="seg alt" id="segTarget"><button data-a="target" data-v="152">152</button><button data-a="target" data-v="100">100</button><button data-a="target" data-v="200">200</button></div></div>
    <div class="opt"><span class="lb">تعادل المشتري في جولة عادية (81–81 حكم، 65–65 صن)</span><div class="seg alt" id="segTieR"><button data-a="tieRule" data-v="split">كل فريق ياخذ نقاطه</button><button data-a="tieRule" data-v="buyerLoses">المشتري يخسر</button></div></div>
    <div class="opt"><span class="lb">الدبل في الصن</span><div class="seg alt" id="segSunD"><button data-a="sunDouble" data-v="over100">بعد 100</button><button data-a="sunDouble" data-v="always">دائماً</button><button data-a="sunDouble" data-v="off">لا</button></div></div>
    <div class="opt"><span class="lb">المشاريع في الثري والفور</span><div class="seg alt" id="segPM"><button data-a="projMult" data-v="mult">تتضاعف مثل الجولة</button><button data-a="projMult" data-v="double">×2 بس</button></div></div>
    <div class="opt"><span class="lb">الكبوت في الدبل</span><div class="seg alt" id="segKM"><button data-a="kabootMult" data-v="1">يتضاعف</button><button data-a="kabootMult" data-v="0">ما يتضاعف</button></div></div>
    ${window.claude ? '' : `<div class="opt"><span class="lb">مفتاح Anthropic لقراءة الصور (يبقى في جهازك)</span><input class="key" id="aikey" placeholder="sk-ant-…" value="${esc(getKey())}" autocomplete="off" spellcheck="false" autocapitalize="off"></div>`}
    <button class="soft press" data-a="newGame">صكة جديدة</button>
    <div class="note">الحساب: صن 130 بنط = 26 نقطة، حكم 162 بنط = 16 نقطة (الخمسة تنزل). الكبوت 44 صن و25 حكم. الدبل: الفائز ياخذ الجولة كاملة ×2/×3/×4 مع المشاريع، والبلوت يبقى 2 لصاحبه. القهوة: اللي يكسب الجولة يكسب الصكة.</div>
  </div>`);
  const sync = () => {
    setSeg($('#segTarget'), String(S.target), ['152', '100', '200']);
    setSeg($('#segTieR'), S.tieRule, ['split', 'buyerLoses']);
    setSeg($('#segSunD'), S.rules.sunDouble, ['over100', 'always', 'off']);
    setSeg($('#segPM'), S.rules.projMult, ['mult', 'double']);
    setSeg($('#segKM'), S.rules.kabootMult ? '1' : '0', ['1', '0']);
  };
  sync(); moreSheet.sync = sync;
  const k = $('#aikey'); if (k) k.onchange = () => { try { const v = k.value.trim(); if (v) localStorage.setItem(KEY_LS, v); else localStorage.removeItem(KEY_LS); } catch (e) {} initAI(); toast(k.value.trim() ? 'حفظنا المفتاح' : 'حذفنا المفتاح'); };
}
function shareText() {
  const t = totals();
  return [`بلوت — لنا ${t.us} · لهم ${t.them} (الصكة على ${S.target})`].concat(S.rounds.map((r, i) => `${i + 1}. ${modeLabel(r)}${r.level && r.level !== 'normal' ? ' ' + LV[r.level].ar : ''} — لنا ${r.us} · لهم ${r.them}`)).join('\n');
}
async function share() {
  const text = shareText();
  try { if (navigator.share) { await navigator.share({ text }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(text); toast('نسخنا النتيجة'); } catch (e) { toast('ما قدرنا ننسخ — جرّب من متصفح ثاني'); }
}

/* ---------- events ---------- */
const A = {
  close: () => closeSheet(),
  askYes: () => { const f = ASKFN; ASKFN = null; if (f) f(); },
  pTeam2: v => { PT = v; projUpdate(); },
  pAdd: v => { const c = C(); if (E.validateProjects(c.mode, c.projects.concat([{ type: v, team: PT }])).length) return;
    c.projects.push({ type: v, team: PT }); if (!hasSameBest()) c.tieWinner = null; haptic(); save(); projUpdate(); renderProjRow(); },
  pDel: v => { const c = C(); c.projects.splice(+v, 1); if (!hasSameBest()) c.tieWinner = null; save(); projUpdate(); renderProjRow(); },
  tieW: v => { C().tieWinner = v; save(); projUpdate(); },
  mTeam: v => { M.team = v; M.kaboot = null; manualUpdate(); },
  key: v => { if (M.kaboot) { M.kaboot = null; M.val = ''; } if (M.val.length < 3) M.val = (M.val === '0' ? '' : M.val) + v; manualUpdate(); },
  back: () => { if (M.kaboot) M.kaboot = null; else M.val = M.val.slice(0, -1); manualUpdate(); },
  clr: () => { M.kaboot = null; M.val = ''; manualUpdate(); },
  kab: v => { M.kaboot = M.kaboot === v ? null : v; M.val = ''; haptic(); manualUpdate(); },
  voice: () => listen(),
  mSave: () => { const o = manualCalc(); if (o.r && !o.r.error) commit(o.r, M.heard ? 'voice' : 'manual'); },
  card: v => { if (P.cards.has(v)) { P.cards.delete(v); P.ai.delete(v); } else P.cards.add(v);
    const b = document.querySelector(`.cd[data-v="${v}"]`); if (b) { b.classList.toggle('on', P.cards.has(v)); b.classList.toggle('ai', P.ai.has(v)); b.setAttribute('aria-pressed', String(P.cards.has(v))); }
    pileUpdate(); },
  pTeam: v => { P.team = v; pileUpdate(); },
  pLast: v => { P.last = v; pileUpdate(); },
  pickCam: () => $('#photoCam').click(),
  pickLib: () => $('#photoLib').click(),
  pickGrid: () => pileSheet(),
  addPhoto: () => srcSheet(),
  retake: v => { const ph = P.photos.find(x => String(x.id) === v); if (!ph) return; PICK.replace = ph.id; $(ph.src === 'cam' ? '#photoCam' : '#photoLib').click(); },
  delPhoto: v => { const i = P.photos.findIndex(x => String(x.id) === v); if (i < 0) return; dropPhotoCards(P.photos[i]); P.photos.splice(i, 1); P.cur = P.photos.length - 1; pileSheet(); },
  showPhoto: v => { P.cur = +v; pileSheet(); },
  pSave: () => { const o = pileCalc(); if (o.r && !o.r.error) { commit(o.r, 'scan'); P = null; } },
  edit: v => startEdit(+v),
  editOpen: () => { const r = S.edit && S.rounds[S.edit.i]; manualSheet(r && r.kaboot ? { kaboot: r.kaboot } : { team: 'us', val: r && r.abnat != null ? String(r.abnat) : '' }); },
  editCancel: () => cancelEdit(),
  del: v => {
    const i = +v, r = S.rounds[i]; if (!r) return;
    if (S.edit) cancelEdit();
    S.rounds.splice(i, 1); lastSaved = null; save(); renderHome(); histSheet();
    toast(`حذفنا الجولة ${i + 1}`, 'تراجع', () => { S.rounds.splice(Math.min(i, S.rounds.length), 0, r); save(); renderHome(); if (SK === 'hist') histSheet(); });
  },
  undo: () => { undoLast(); if (SK === 'hist') histSheet(); },
  newGame: () => newGame(),
  newGameNow: () => newGame(true),
  target: v => { S.target = +v; save(); moreSheet.sync(); renderHome(); },
  tieRule: v => { S.tieRule = v; save(); moreSheet.sync(); },
  sunDouble: v => { S.rules.sunDouble = v; save(); moreSheet.sync(); renderHome(); },
  projMult: v => { S.rules.projMult = v; save(); moreSheet.sync(); },
  kabootMult: v => { S.rules.kabootMult = v === '1'; save(); moreSheet.sync(); },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  const f = A[el.dataset.a]; if (f) f(el.dataset.v, el);
});
const segPick = (e, fn) => { const b = e.target.closest('button[data-v]'); if (b) fn(b.dataset.v); };
$('#segMode').onclick = e => segPick(e, v => {
  const c = C(); if (c.mode === v) return;
  c.mode = v; c.projects = c.projects.filter(p => E.PROJECTS[p.type].modes.includes(v)); c.tieWinner = null;
  haptic(); fixLevel(); save(); renderHome();
});
$('#suits').onclick = e => { const b = e.target.closest('.suit'); if (!b) return; C().trump = b.dataset.v; haptic(); save(); renderHome(); };
$('#segBuyer').onclick = e => segPick(e, v => { C().buyer = v; haptic(); fixLevel(); save(); renderHome(); });
$('#lvBox').onclick = e => segPick(e, v => { if (!levelOpts().includes(v)) return; C().level = v; haptic(); save(); renderHome(); });
$('#bProj').onclick = () => { PT = C().buyer; projSheet(); };
$('#bScan').onclick = () => startScan();
$('#bManual').onclick = () => manualSheet();
$('#bMic').onclick = () => { if (needTrump()) { nudgeSuits(); return; } listen(); };
$('#bHist').onclick = () => histSheet();
$('#bMore').onclick = () => moreSheet();
$('#bShare').onclick = () => share();
$('#scrim').onclick = () => closeSheet();
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSheet();
  if (SK === 'manual' && !e.target.closest('input')) {
    if (/^\d$/.test(e.key)) A.key(e.key); else if (e.key === 'Backspace') A.back(); else if (e.key === 'Enter') { e.preventDefault(); if (!$('#mGo').disabled) A.mSave(); }
  }
});
window.addEventListener('storage', e => { if (e.key === LS) { load(); renderHome(); } });
renderHome();
initAI();
</script>
</body>
</html>
